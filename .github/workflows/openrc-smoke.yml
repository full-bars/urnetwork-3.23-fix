name: OpenRC (Alpine) smoke

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'releases/**'
  schedule:
    # Weekly, so Alpine packaging drift (a moved package, a changed
    # supervise-daemon flag, a new release tag layout) is caught even when no
    # PR touches this code.
    - cron: '37 4 * * 1'
  workflow_dispatch:

# Same rationale as unix-lifecycle.yml: a PR already triggers this, so push is
# scoped to main. Rapid pushes to a PR supersede rather than stack.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A version tag that can never collide with a real release, so a misconfigured
  # URL fails loudly instead of silently downloading a published build.
  CI_TAG: v3.23.0-fix.0.0.0-cislot

jobs:
  openrc-smoke:
    name: OpenRC service path (${{ matrix.binarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - binarch: amd64
          - binarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build urnet-tools and the fake provider
        env:
          GOPROXY: "https://proxy.golang.org|https://goproxy.io,direct"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if go build -o urnet-tools ./cmd/urnet-tools/; then
              echo "Build succeeded"; break
            fi
            if [ $attempt -lt 3 ]; then sleep 10; fi
            if [ $attempt -eq 3 ]; then echo "Build failed after 3 attempts"; exit 1; fi
          done
          # The fake provider stands in for the real provider: it answers
          # --version and serves the control socket, which is what discovery and
          # the update-verify step actually talk to. The real binary exits
          # without a JWT, which would crash-respawn every 5s under
          # supervise-daemon and make version polling time out.
          go build -o urnetwork-fake ./cmd/fake-provider/
          ls -la urnet-tools urnetwork-fake

      - name: Stage a fake release the installer can fetch
        # The installer normally pulls a published release. The base-URL
        # overrides in Provider_Install_Linux.sh (URNET_API_BASE /
        # URNET_DL_BASE / URNET_MIRROR_BASE) let a branch build be served from
        # our own directory, so the installer's REAL download and extract path
        # runs unmodified — that is the point of the smoke test.
        run: |
          set -euo pipefail
          ROOT="$PWD/fake-release"
          DL="$ROOT/releases/download/$CI_TAG"
          mkdir -p "$DL"

          # Provider tarball. The layout is NOT free-form: the installer
          # extracts and then reads $workdir/linux/$arch/provider, so the path
          # inside the archive must be exactly that or the install fails with
          # "Provider binary was not found in the tarball".
          # The installer derives `arch` from `uname -m` and only normalizes
          # aarch64 -> arm64, so x86_64 stays x86_64. The archive path must use
          # that same string or the lookup misses.
          TARCH="${{ matrix.binarch }}"
          STAGE="$PWD/stage"
          mkdir -p "$STAGE/linux/$TARCH"
          cp urnetwork-fake "$STAGE/linux/$TARCH/provider"
          cp urnet-tools "$STAGE/linux/$TARCH/urnet-tools"
          tar -czf "$DL/urnetwork-provider-$CI_TAG.tar.gz" -C "$STAGE" linux

          # The tool binary is also fetched directly from the mirror path.
          cp urnet-tools "$DL/urnet-tools-linux-${{ matrix.binarch }}"

          # Release metadata, in the GitHub release shape the installer parses
          # (.tag_name).
          mkdir -p "$ROOT/api"
          cat > "$ROOT/api/latest.json" <<EOF
          {"tag_name": "$CI_TAG"}
          EOF

          # The installer script itself.
          mkdir -p "$ROOT/stage"
          cp scripts/Provider_Install_Linux.sh "$ROOT/stage/install.sh"

          echo "fake release staged under $ROOT:"
          find "$ROOT" -type f | sed "s|^$PWD/|  |"

      - name: Install and exercise the service on a stripped Alpine
        # `docker run` on the HOST runner, deliberately NOT the `container:`
        # job key. Using container: would execute this inside Alpine's own musl
        # userspace and destroy the premise: what is under test is a static Go
        # binary plus a POSIX-shell installer running against a real Alpine
        # root filesystem with OpenRC as init.
        #
        # --cap-add SYS_PTRACE is REQUIRED, not decoration. Docker strips
        # CAP_SYS_PTRACE from the container's bounding set, so a provider
        # running as the service user cannot read /proc/<pid>/exe for a process
        # owned by another uid. Any step that reads a version across users then
        # false-fails with "could not determine version" although nothing is
        # broken. Real hosts carry this capability by default.
        env:
          CI_TAG: ${{ env.CI_TAG }}
        run: |
          set -euo pipefail
          docker run --rm \
            --cap-add SYS_PTRACE \
            -e CI_TAG="$CI_TAG" \
            -v "$PWD/fake-release:/srv/fake-release:ro" \
            -v "$PWD/scripts/ci/openrc-smoke.sh:/srv/smoke.sh:ro" \
            alpine:latest \
            sh /srv/smoke.sh 2>&1 | tee /tmp/openrc-smoke.log

      - name: Upload the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrc-smoke-${{ matrix.binarch }}
          path: /tmp/openrc-smoke.log
          if-no-files-found: warn

  lint-shell:
    name: Installer shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dash + bash + shellcheck
        run: |
          set -euo pipefail
          # The installer runs under `sh` on Alpine, where sh is busybox ash.
          # Syntax bash accepts and ash rejects is a latent breakage that only
          # surfaces on a real Alpine box, so lint against dash as well as bash.
          sudo apt-get update -qq
          sudo apt-get install -y -qq dash
          rc=0
          for f in scripts/Provider_Install_Linux.sh scripts/test_provider_install.sh; do
            echo "== $f =="
            dash -n  "$f" && echo "  dash OK"        || rc=1
            bash -n  "$f" && echo "  bash OK"        || rc=1
            shellcheck -S error "$f" && echo "  shellcheck OK" || rc=1
          done
          exit $rc