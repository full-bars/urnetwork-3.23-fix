name: Upstream Monitoring

on:
  schedule:
    - cron: '0 0,12 * * *' # Run twice a day (midnight and noon UTC)
  workflow_dispatch: # Allow manual triggering from the Actions tab

jobs:
  monitor-critical-files:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor critical file changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          UPSTREAM_REPO="urnetwork/connect"

          # Regex patterns for files that affect the provider fork.
          # Patterns use extended regex (-E); ^ anchors match start of filename.
          # Grouped by subsystem for maintainability:
          #   ip_*       — all IP/packet/security files
          #   transfer_* — all contract/routing/encryption files
          #   transport* — all transport abstraction files
          #   net_*      — all HTTP/resilience/TLS/extender files
          #   message_*  — all buffer/message-pool files
          #   proxy_*    — all proxy health/URL/probe files
          #   protocol/  — protobuf definitions
          #   provider/  — CLI entry point
          #   build      — go.mod, Dockerfile, Makefile, security generator
          CRITICAL_FILES=(
            "^ip\.go$"
            "^ip_packet\.go$"
            "^ip_remote_multi_client"
            "^ip_security"
            "^ip_test\.go$"
            "^transfer\.go$"
            "^transfer_"
            "^transport"
            "^net_"
            "^message_"
            "^proxy_"
            "^provider/main\.go$"
            "^protocol/.*\.proto$"
            "^go\.mod$"
            "^go\.sum$"
            "^Makefile$"
            "^Dockerfile$"
            "^security/gen\.sh$"
          )

          echo "Fetching recently updated PRs from $UPSTREAM_REPO..."

          # Fetch the 15 most recently updated open PRs
          PRS=$(gh api repos/$UPSTREAM_REPO/pulls?state=open\&sort=updated\&direction=desc\&per_page=15)

          # Calculate timestamp for 12 hours ago
          TWELVE_HOURS_AGO=$(date -u -d "12 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

          echo "$PRS" | jq -c '.[]' | while read -r pr; do
            PR_NUMBER=$(echo "$pr" | jq -r '.number')
            PR_TITLE=$(echo "$pr" | jq -r '.title')
            PR_URL=$(echo "$pr" | jq -r '.html_url')
            PR_UPDATED=$(echo "$pr" | jq -r '.updated_at')
            PR_AUTHOR=$(echo "$pr" | jq -r '.user.login')
            PR_AVATAR=$(echo "$pr" | jq -r '.user.avatar_url')

            if [[ "$PR_UPDATED" > "$TWELVE_HOURS_AGO" ]]; then
              FILES=$(gh api repos/$UPSTREAM_REPO/pulls/$PR_NUMBER/files | jq -r '.[].filename')

              MATCHED_FILES=""
              while IFS= read -r filename; do
                for pattern in "${CRITICAL_FILES[@]}"; do
                  if echo "$filename" | grep -q -E "$pattern"; then
                    MATCHED_FILES="$MATCHED_FILES \`$filename\`"
                    break
                  fi
                done
              done <<< "$FILES"

              if [ -n "$MATCHED_FILES" ]; then
                echo "🚨 CRITICAL: PR #$PR_NUMBER touches:$MATCHED_FILES"

                AI_SUMMARY="*AI Summary unavailable.*"
                if [ -n "$DEEPSEEK_API_KEY" ]; then
                  PR_DIFF=$(curl -sL "https://github.com/${UPSTREAM_REPO}/pull/${PR_NUMBER}.diff")
                  TRUNCATED_DIFF="${PR_DIFF:0:60000}"
                  JSON_PAYLOAD=$(jq -n --arg diff "$TRUNCATED_DIFF" '{
                    "model": "deepseek-v4-flash",
                    "messages": [{
                      "role": "user",
                      "content": ("You are an expert Go developer. Summarize the following pull request code diff in under 150 words. Focus strictly on architectural changes, performance impacts, and potential breaking changes to routing or encryption. Keep it concise, professional, and skip introductory pleasantries.\n\nDiff:\n" + $diff)
                    }],
                    "temperature": 0.2,
                    "max_tokens": 1500
                  }')

                  DEEPSEEK_RESPONSE=$(curl -s -H "Content-Type: application/json" \
                    -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
                    -d "$JSON_PAYLOAD" \
                    "https://api.deepseek.com/chat/completions")

                  # Debug: log first 200 chars of response
                  echo "[DEBUG] DeepSeek response (first 200 chars): ${DEEPSEEK_RESPONSE:0:200}"

                  # Check for API errors first
                  API_ERROR=$(echo "$DEEPSEEK_RESPONSE" | jq -r '.error.message // empty')
                  if [ -n "$API_ERROR" ]; then
                    AI_SUMMARY="*API Error: $API_ERROR*"
                    echo "[ERROR] DeepSeek API error: $API_ERROR"
                  else
                    RAW_SUMMARY=$(echo "$DEEPSEEK_RESPONSE" | jq -r '.choices[0].message.content // empty')
                    if [ -n "$RAW_SUMMARY" ]; then
                      AI_SUMMARY="${RAW_SUMMARY:0:3800}"
                      echo "[SUCCESS] Generated AI summary (${#RAW_SUMMARY} chars)"
                    else
                      # Log raw response for debugging when jq extraction fails
                      echo "[ERROR] Failed to extract summary from response. Full response:"
                      echo "$DEEPSEEK_RESPONSE" | jq . 2>/dev/null || echo "$DEEPSEEK_RESPONSE"
                      AI_SUMMARY="*Error: Unexpected API response format* (check workflow logs)"
                    fi
                  fi
                fi

                if [ -n "$DISCORD_WEBHOOK" ]; then
                  DISCORD_JSON=$(jq -n \
                    --arg url "$PR_URL" \
                    --arg prTitle "$PR_TITLE" \
                    --arg author "$PR_AUTHOR" \
                    --arg avatar "$PR_AVATAR" \
                    --arg summary "$AI_SUMMARY" \
                    --arg files "$MATCHED_FILES" \
                  '{
                    "embeds": [{
                      "title": "🚨 Upstream PR Modifies Critical Files",
                      "url": $url,
                      "description": ("**PR:** [" + $prTitle + "](" + $url + ")\n**Author:** " + $author + "\n\n**Modified Files:**\n" + $files + "\n\n**🤖 AI Summary:**\n>>> " + $summary),
                      "color": 16711680,
                      "thumbnail": { "url": $avatar },
                      "footer": { "text": "URNetwork Upstream Monitor • Critical Files" }
                    }]
                  }')
                  curl -sf -H "Content-Type: application/json" -d "$DISCORD_JSON" "$DISCORD_WEBHOOK"
                fi
              fi
            fi
          done

  monitor-all-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor all upstream PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          UPSTREAM_REPO="urnetwork/connect"

          echo "Fetching recently updated PRs from $UPSTREAM_REPO..."
          PRS=$(gh api repos/$UPSTREAM_REPO/pulls?state=open\&sort=updated\&direction=desc\&per_page=5)

          TWELVE_HOURS_AGO=$(date -u -d "12 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

          echo "$PRS" | jq -c '.[]' | while read -r pr; do
            PR_NUMBER=$(echo "$pr" | jq -r '.number')
            PR_TITLE=$(echo "$pr" | jq -r '.title')
            PR_URL=$(echo "$pr" | jq -r '.html_url')
            PR_UPDATED=$(echo "$pr" | jq -r '.updated_at')
            PR_AUTHOR=$(echo "$pr" | jq -r '.user.login')
            PR_AVATAR=$(echo "$pr" | jq -r '.user.avatar_url')

            if [[ "$PR_UPDATED" > "$TWELVE_HOURS_AGO" ]]; then
              echo "📢 New/Updated PR: #$PR_NUMBER by $PR_AUTHOR"

              if [ -n "$DISCORD_WEBHOOK" ]; then
                DISCORD_JSON=$(jq -n \
                  --arg url "$PR_URL" \
                  --arg prTitle "$PR_TITLE" \
                  --arg author "$PR_AUTHOR" \
                  --arg avatar "$PR_AVATAR" \
                '{
                  "embeds": [{
                    "title": "📢 Upstream PR Activity",
                    "url": $url,
                    "description": ("**PR:** [" + $prTitle + "](" + $url + ")\n**Author:** " + $author),
                    "color": 3447003,
                    "thumbnail": { "url": $avatar },
                    "footer": { "text": "URNetwork Upstream Monitor • All PRs" }
                  }]
                }')
                curl -sf -H "Content-Type: application/json" -d "$DISCORD_JSON" "$DISCORD_WEBHOOK"
              fi
            fi
          done

  monitor-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor upstream commits to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          UPSTREAM_REPO="urnetwork/connect"

          # Keep in sync with the CRITICAL_FILES in monitor-critical-files above.
          CRITICAL_FILES=(
            "^ip\.go$"
            "^ip_packet\.go$"
            "^ip_remote_multi_client"
            "^ip_security"
            "^ip_test\.go$"
            "^transfer\.go$"
            "^transfer_"
            "^transport"
            "^net_"
            "^message_"
            "^proxy_"
            "^provider/main\.go$"
            "^protocol/.*\.proto$"
            "^go\.mod$"
            "^go\.sum$"
            "^Makefile$"
            "^Dockerfile$"
            "^security/gen\.sh$"
          )

          echo "Fetching recent commits to $UPSTREAM_REPO/main..."

          # Fetch last 20 commits to main
          COMMITS=$(gh api repos/$UPSTREAM_REPO/commits?sha=main\&per_page=20)

          TWELVE_HOURS_AGO=$(date -u -d "12 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

          echo "$COMMITS" | jq -c '.[]' | while read -r commit; do
            COMMIT_SHA=$(echo "$commit" | jq -r '.sha' | cut -c1-8)
            COMMIT_MSG=$(echo "$commit" | jq -r '.commit.message' | head -1)
            COMMIT_URL=$(echo "$commit" | jq -r '.html_url')
            COMMIT_AUTHOR=$(echo "$commit" | jq -r '.commit.author.name')
            COMMIT_DATE=$(echo "$commit" | jq -r '.commit.author.date')

            if [[ "$COMMIT_DATE" > "$TWELVE_HOURS_AGO" ]]; then
              COMMIT_FILES=$(gh api repos/$UPSTREAM_REPO/commits/$COMMIT_SHA | jq -r '.files[].filename')

              MATCHED_FILES=""
              while IFS= read -r filename; do
                for pattern in "${CRITICAL_FILES[@]}"; do
                  if echo "$filename" | grep -q -E "$pattern"; then
                    MATCHED_FILES="$MATCHED_FILES \`$filename\`"
                    break
                  fi
                done
              done <<< "$COMMIT_FILES"

              if [ -n "$MATCHED_FILES" ]; then
                echo "✅ MERGED: Commit $COMMIT_SHA touches:$MATCHED_FILES"

                AI_SUMMARY=""
                if [ -n "$DEEPSEEK_API_KEY" ]; then
                  COMMIT_SHA_FULL=$(echo "$commit" | jq -r '.sha')
                  RAW_DIFF=$(curl -sL "https://github.com/${UPSTREAM_REPO}/commit/${COMMIT_SHA_FULL}.diff" 2>/dev/null || echo "")
                  TRUNCATED_DIFF="${RAW_DIFF:0:60000}"
                  if [ -n "$TRUNCATED_DIFF" ]; then
                    JSON_PAYLOAD=$(jq -n --arg diff "$TRUNCATED_DIFF" '{
                      "model": "deepseek-v4-flash",
                      "messages": [{
                        "role": "user",
                        "content": ("You are an expert Go developer. Summarize this commit diff in under 100 words. Focus on architectural changes, performance impact, and breaking changes. Skip pleasantries.\n\nDiff:\n" + $diff)
                      }],
                      "temperature": 0.2,
                      "max_tokens": 1000
                    }')
                    DEEPSEEK_RESPONSE=$(curl -s -H "Content-Type: application/json" \
                      -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
                      -d "$JSON_PAYLOAD" \
                      "https://api.deepseek.com/chat/completions")
                    API_ERROR=$(echo "$DEEPSEEK_RESPONSE" | jq -r '.error.message // empty')
                    if [ -z "$API_ERROR" ]; then
                      RAW_SUMMARY=$(echo "$DEEPSEEK_RESPONSE" | jq -r '.choices[0].message.content // empty')
                      [ -n "$RAW_SUMMARY" ] && AI_SUMMARY="${RAW_SUMMARY:0:3800}"
                    fi
                  fi
                fi

                if [ -n "$DISCORD_WEBHOOK" ]; then
                  DISCORD_JSON=$(jq -n \
                    --arg url "$COMMIT_URL" \
                    --arg sha "$COMMIT_SHA" \
                    --arg msg "$COMMIT_MSG" \
                    --arg author "$COMMIT_AUTHOR" \
                    --arg files "$MATCHED_FILES" \
                    --arg summary "$AI_SUMMARY" \
                  '{
                    "embeds": [{
                      "title": "✅ Upstream Commit to Main (Critical Files)",
                      "url": $url,
                      "description": ("**Commit:** `" + $sha + "`\n**Author:** " + $author + "\n**Message:** " + $msg + "\n\n**Modified Files:**\n" + $files + (if $summary != "" then "\n\n**🤖 Summary:**\n" + $summary else "" end)),
                      "color": 65280,
                      "footer": { "text": "URNetwork Upstream Monitor • Merged" }
                    }]
                  }')
                  curl -sf -H "Content-Type: application/json" -d "$DISCORD_JSON" "$DISCORD_WEBHOOK"
                fi
              fi
            fi
          done

  monitor-sibling-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Detect sibling-fork commits to critical files not yet ported
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # full-bars/connect is the upstream-tracking sibling fork: safety fixes
          # (message-pool corrections, bandwidth-leak gating, etc.) land there
          # first and must then be ported into this production fork. The two
          # trees drift silently otherwise - FORK_CHANGES.md tracks what the fork
          # ADDS, nothing tracks what it is MISSING. Surface recent sibling
          # commits that touch shared critical files so a human can decide
          # whether each needs porting.
          SIBLING_REPO="full-bars/connect"

          # Keep in sync with the CRITICAL_FILES in monitor-critical-files above.
          CRITICAL_FILES=(
            "^ip\.go$"
            "^ip_packet\.go$"
            "^ip_remote_multi_client"
            "^ip_security"
            "^ip_test\.go$"
            "^transfer\.go$"
            "^transfer_"
            "^transport"
            "^net_"
            "^message_"
            "^proxy_"
            "^provider/main\.go$"
            "^protocol/.*\.proto$"
            "^go\.mod$"
            "^go\.sum$"
            "^Makefile$"
            "^Dockerfile$"
            "^security/gen\.sh$"
          )

          echo "Fetching recent commits to $SIBLING_REPO/main..."
          COMMITS=$(gh api repos/$SIBLING_REPO/commits?sha=main\&per_page=20)

          TWELVE_HOURS_AGO=$(date -u -d "12 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

          echo "$COMMITS" | jq -c '.[]' | while read -r commit; do
            COMMIT_SHA=$(echo "$commit" | jq -r '.sha' | cut -c1-8)
            COMMIT_MSG=$(echo "$commit" | jq -r '.commit.message' | head -1)
            COMMIT_URL=$(echo "$commit" | jq -r '.html_url')
            COMMIT_AUTHOR=$(echo "$commit" | jq -r '.commit.author.name')
            COMMIT_DATE=$(echo "$commit" | jq -r '.commit.author.date')

            if [[ "$COMMIT_DATE" > "$TWELVE_HOURS_AGO" ]]; then
              COMMIT_FILES=$(gh api repos/$SIBLING_REPO/commits/$COMMIT_SHA | jq -r '.files[].filename')

              MATCHED_FILES=""
              while IFS= read -r filename; do
                for pattern in "${CRITICAL_FILES[@]}"; do
                  if echo "$filename" | grep -q -E "$pattern"; then
                    MATCHED_FILES="$MATCHED_FILES \`$filename\`"
                    break
                  fi
                done
              done <<< "$COMMIT_FILES"

              if [ -n "$MATCHED_FILES" ]; then
                echo "🔀 SIBLING DRIFT: Commit $COMMIT_SHA touches:$MATCHED_FILES"

                if [ -n "$DISCORD_WEBHOOK" ]; then
                  DISCORD_JSON=$(jq -n \
                    --arg url "$COMMIT_URL" \
                    --arg sha "$COMMIT_SHA" \
                    --arg msg "$COMMIT_MSG" \
                    --arg author "$COMMIT_AUTHOR" \
                    --arg files "$MATCHED_FILES" \
                  '{
                    "embeds": [{
                      "title": "🔀 Sibling Fork Advanced on Critical Files (port check)",
                      "url": $url,
                      "description": ("full-bars/connect committed to a file shared with this production fork. Confirm whether the change needs porting here.\n\n**Commit:** `" + $sha + "`\n**Author:** " + $author + "\n**Message:** " + $msg + "\n\n**Modified Files:**\n" + $files),
                      "color": 16753920,
                      "footer": { "text": "URNetwork Fork Drift Monitor • Port check" }
                    }]
                  }')
                  curl -sf -H "Content-Type: application/json" -d "$DISCORD_JSON" "$DISCORD_WEBHOOK"
                fi
              fi
            fi
          done

  monitor-build-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Watch urnetwork/build for new releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          BUILD_REPO="urnetwork/build"
          UPSTREAM_REPO="urnetwork/connect"

          # Same critical-file patterns as the commit monitor above.
          CRITICAL_FILES=(
            "^ip\.go$"
            "^ip_packet\.go$"
            "^ip_remote_multi_client"
            "^ip_security"
            "^transfer\.go$"
            "^transfer_"
            "^transport"
            "^net_"
            "^message_"
            "^proxy_"
            "^provider/main\.go$"
            "^protocol/.*\.proto$"
            "^go\.mod$"
            "^go\.sum$"
            "^Makefile$"
            "^Dockerfile$"
            "^security/gen\.sh$"
          )

          # Files that are client-only / not used by the provider binary.
          # When ALL modified files match these patterns, the notification
          # explicitly says "client-only" so you don't worry.
          CLIENT_ONLY_FILES=(
            "^tun"
            "^transport_p2p_webrtc_pc_js"
            "^transport_p2p_webrtc_android"
            "^connect_filtered_path"
            "^connectctl/"
            "^hub/"
            "^mobile/"
            "\.aar$"
            "\.xcframework$"
            "^v2026/"
            "^security/ips\.go$"
            "^security/ips\.txt$"
          )

          echo "Fetching latest releases from $BUILD_REPO..."

          RELEASES=$(gh api repos/$BUILD_REPO/releases?per_page=2)
          LATEST_TAG=$(echo "$RELEASES" | jq -r '.[0].tag_name')
          PREV_TAG=$(echo "$RELEASES" | jq -r '.[1].tag_name')
          LATEST_DATE=$(echo "$RELEASES" | jq -r '.[0].created_at')
          LATEST_URL=$(echo "$RELEASES" | jq -r '.[0].html_url')

          TWELVE_HOURS_AGO=$(date -u -d "12 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

          if [[ "$LATEST_DATE" < "$TWELVE_HOURS_AGO" ]]; then
            echo "No new releases in window. Latest: $LATEST_TAG ($LATEST_DATE)"
            exit 0
          fi

          echo "New release: $LATEST_TAG (previous: $PREV_TAG, created: $LATEST_DATE)"

          PREV_SHA=$(gh api repos/$UPSTREAM_REPO/git/refs/tags/$PREV_TAG -q '.object.sha' 2>/dev/null || echo "")
          LATEST_SHA=$(gh api repos/$UPSTREAM_REPO/git/refs/tags/$LATEST_TAG -q '.object.sha' 2>/dev/null || echo "")

          if [ -z "$LATEST_SHA" ]; then
            echo "Tag $LATEST_TAG not yet in $UPSTREAM_REPO — delaying until next run"
            exit 0
          fi

          COMMIT_COUNT="?"
          CRITICAL_MATCHES=""
          ALL_FILES=""
          CLIENT_ONLY_COUNT=0
          SAMPLE_COMMIT=""
          AI_SUMMARY=""

          if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$LATEST_SHA" ]; then
            COMPARE=$(gh api repos/$UPSTREAM_REPO/compare/$PREV_TAG...$LATEST_TAG 2>/dev/null || echo "")
            COMMIT_COUNT=$(echo "$COMPARE" | jq -r '.total_commits // "?"')

            MODIFIED_FILES=$(echo "$COMPARE" | jq -r '.files[].filename // empty')
            while IFS= read -r filename; do
              [ -z "$filename" ] && continue
              ALL_FILES="$ALL_FILES \`$filename\`"

              IS_CRITICAL=false
              for pattern in "${CRITICAL_FILES[@]}"; do
                if echo "$filename" | grep -q -E "$pattern"; then
                  CRITICAL_MATCHES="$CRITICAL_MATCHES \`$filename\`"
                  IS_CRITICAL=true
                  break
                fi
              done

              if ! $IS_CRITICAL; then
                for pattern in "${CLIENT_ONLY_FILES[@]}"; do
                  if echo "$filename" | grep -q -E "$pattern"; then
                    CLIENT_ONLY_COUNT=$((CLIENT_ONLY_COUNT + 1))
                    break
                  fi
                done
              fi
            done <<< "$MODIFIED_FILES"

            SAMPLE_COMMIT=$(echo "$COMPARE" | jq -r '.commits[-1].commit.message // empty' | head -1 | cut -c1-200)

            AI_SUMMARY=""
            if [ -n "$DEEPSEEK_API_KEY" ]; then
              RAW_DIFF=$(curl -sL "https://github.com/${UPSTREAM_REPO}/compare/${PREV_TAG}...${LATEST_TAG}.diff" 2>/dev/null || echo "")
              TRUNCATED_DIFF="${RAW_DIFF:0:60000}"
              if [ -n "$TRUNCATED_DIFF" ]; then
                JSON_PAYLOAD=$(jq -n --arg diff "$TRUNCATED_DIFF" '{
                  "model": "deepseek-v4-flash",
                  "messages": [{
                    "role": "user",
                    "content": ("You are an expert Go developer. The following is the git diff between two releases of urnetwork/connect. Summarize the changes in under 150 words. Focus on architecture changes, performance impact, and any provider-impacting changes. Skip introductory pleasantries.\n\nDiff:\n" + $diff)
                  }],
                  "temperature": 0.2,
                  "max_tokens": 1500
                }')

                DEEPSEEK_RESPONSE=$(curl -s -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
                  -d "$JSON_PAYLOAD" \
                  "https://api.deepseek.com/chat/completions")

                API_ERROR=$(echo "$DEEPSEEK_RESPONSE" | jq -r '.error.message // empty')
                if [ -n "$API_ERROR" ]; then
                  echo "[ERROR] DeepSeek API error: $API_ERROR"
                else
                  RAW_SUMMARY=$(echo "$DEEPSEEK_RESPONSE" | jq -r '.choices[0].message.content // empty')
                  if [ -n "$RAW_SUMMARY" ]; then
                    AI_SUMMARY="${RAW_SUMMARY:0:3800}"
                    echo "[SUCCESS] Generated AI summary (${#RAW_SUMMARY} chars)"
                  else
                    echo "[ERROR] Failed to extract summary from response"
                  fi
                fi
              fi
            fi
          fi

          # Build title, colour, and classification note
          if [ -n "$CRITICAL_MATCHES" ]; then
            TITLE="🚀 New Build Release — Provider Impact"
            COLOR=16776960
            CLASSIFICATION="**⚠️ Provider-critical files changed** — evaluate porting need"
          elif [ "$CLIENT_ONLY_COUNT" -gt 0 ] && [ "$CLIENT_ONLY_COUNT" -eq "$(echo "$ALL_FILES" | wc -w)" ]; then
            TITLE="📦 New Build Release — Client Only"
            COLOR=3447003
            CLASSIFICATION="**ℹ️ Client-only release** — no provider impact"
          else
            TITLE="📦 New Build Release"
            COLOR=3447003
            CLASSIFICATION="**ℹ️ No provider-critical files changed**"
          fi

          DESCRIPTION="**Release:** [$LATEST_TAG]($LATEST_URL)\n"
          DESCRIPTION+="**Previous:** \`$PREV_TAG\`\n"
          DESCRIPTION+="**Commits:** $COMMIT_COUNT\n\n"
          DESCRIPTION+="$CLASSIFICATION\n\n"

          if [ -n "$CRITICAL_MATCHES" ]; then
            DESCRIPTION+="**Files changed:**$CRITICAL_MATCHES\n\n"
          fi

          if [ -n "$SAMPLE_COMMIT" ]; then
            DESCRIPTION+="**Last commit:** $SAMPLE_COMMIT"
          fi

          if [ -n "$AI_SUMMARY" ]; then
            DESCRIPTION+="\n\n**🤖 AI Summary:**\n$AI_SUMMARY"
          fi

          echo "---"
          echo -e "$DESCRIPTION"

          if [ -n "$DISCORD_WEBHOOK" ]; then
            DISCORD_JSON=$(jq -n \
              --arg title "$TITLE" \
              --arg desc "$DESCRIPTION" \
              --argjson color $COLOR \
            '{
              "embeds": [{
                "title": $title,
                "description": $desc,
                "color": $color,
                "footer": { "text": "URNetwork Upstream Monitor • Build Releases" }
              }]
            }')
            curl -sf -H "Content-Type: application/json" -d "$DISCORD_JSON" "$DISCORD_WEBHOOK"
          fi
