name: Upstream Monitoring

on:
  schedule:
    - cron: '0 0,12 * * *' # Run twice a day (midnight and noon UTC)
  workflow_dispatch: # Allow manual triggering from the Actions tab

jobs:
  monitor-critical-files:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor critical file changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          UPSTREAM_REPO="urnetwork/connect"

          # The specific files in your fork that you want to protect/monitor
          CRITICAL_FILES=(
            "ip.go"
            "transfer.go"
            "transfer_contract_manager.go"
            "transfer_route_manager.go"
            "net_http.go"
            "net_http_doh.go"
            "transport.go"
            "transfer_encrypt.go"
            "provider/main.go"
            "proxy_health.go"
            "message_pool.go"
          )

          echo "Fetching recently updated PRs from $UPSTREAM_REPO..."

          # Fetch the 15 most recently updated open PRs
          PRS=$(gh api repos/$UPSTREAM_REPO/pulls?state=open\&sort=updated\&direction=desc\&per_page=15)

          # Calculate timestamp for 12 hours ago
          TWELVE_HOURS_AGO=$(date -u -d "12 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

          echo "$PRS" | jq -c '.[]' | while read -r pr; do
            PR_NUMBER=$(echo "$pr" | jq -r '.number')
            PR_TITLE=$(echo "$pr" | jq -r '.title')
            PR_URL=$(echo "$pr" | jq -r '.html_url')
            PR_UPDATED=$(echo "$pr" | jq -r '.updated_at')
            PR_AUTHOR=$(echo "$pr" | jq -r '.user.login')
            PR_AVATAR=$(echo "$pr" | jq -r '.user.avatar_url')

            if [[ "$PR_UPDATED" > "$TWELVE_HOURS_AGO" ]]; then
              FILES=$(gh api repos/$UPSTREAM_REPO/pulls/$PR_NUMBER/files | jq -r '.[].filename')

              MATCHED_FILES=""
              for file in "${CRITICAL_FILES[@]}"; do
                if echo "$FILES" | grep -q "$file"; then
                  MATCHED_FILES="$MATCHED_FILES \`$file\`"
                fi
              done

              if [ -n "$MATCHED_FILES" ]; then
                echo "🚨 CRITICAL: PR #$PR_NUMBER touches:$MATCHED_FILES"

                AI_SUMMARY="*AI Summary unavailable.*"
                if [ -n "$GEMINI_API_KEY" ]; then
                  PR_DIFF=$(curl -sL "https://github.com/${UPSTREAM_REPO}/pull/${PR_NUMBER}.diff")
                  TRUNCATED_DIFF="${PR_DIFF:0:60000}"
                  JSON_PAYLOAD=$(jq -n --arg diff "$TRUNCATED_DIFF" '{
                    "contents": [{
                      "parts": [{
                        "text": ("You are an expert Go developer. Summarize the following pull request code diff in under 150 words. Focus strictly on architectural changes, performance impacts, and potential breaking changes to routing or encryption. Keep it concise, professional, and skip introductory pleasantries.\n\nDiff:\n" + $diff)
                      }]
                    }],
                    "generationConfig": { "temperature": 0.2 }
                  }')

                  GEMINI_RESPONSE=$(curl -s -H "Content-Type: application/json" \
                    -d "$JSON_PAYLOAD" \
                    "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${GEMINI_API_KEY}")

                  # Debug: log first 200 chars of response
                  echo "[DEBUG] Gemini response (first 200 chars): ${GEMINI_RESPONSE:0:200}"

                  # Check for API errors first
                  API_ERROR=$(echo "$GEMINI_RESPONSE" | jq -r '.error.message // empty')
                  if [ -n "$API_ERROR" ]; then
                    AI_SUMMARY="*API Error: $API_ERROR*"
                    echo "[ERROR] Gemini API error: $API_ERROR"
                  else
                    RAW_SUMMARY=$(echo "$GEMINI_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
                    if [ -n "$RAW_SUMMARY" ]; then
                      AI_SUMMARY="${RAW_SUMMARY:0:3800}"
                      echo "[SUCCESS] Generated AI summary (${#RAW_SUMMARY} chars)"
                    else
                      # Log raw response for debugging when jq extraction fails
                      echo "[ERROR] Failed to extract summary from response. Full response:"
                      echo "$GEMINI_RESPONSE" | jq . 2>/dev/null || echo "$GEMINI_RESPONSE"
                      AI_SUMMARY="*Error: Unexpected API response format* (check workflow logs)"
                    fi
                  fi
                fi

                if [ -n "$DISCORD_WEBHOOK" ]; then
                  DISCORD_JSON=$(jq -n \
                    --arg url "$PR_URL" \
                    --arg prTitle "$PR_TITLE" \
                    --arg author "$PR_AUTHOR" \
                    --arg avatar "$PR_AVATAR" \
                    --arg summary "$AI_SUMMARY" \
                    --arg files "$MATCHED_FILES" \
                  '{
                    "embeds": [{
                      "title": "🚨 Upstream PR Modifies Critical Files",
                      "url": $url,
                      "description": ("**PR:** [" + $prTitle + "](" + $url + ")\n**Author:** " + $author + "\n\n**Modified Files:**\n" + $files + "\n\n**🤖 AI Summary:**\n>>> " + $summary),
                      "color": 16711680,
                      "thumbnail": { "url": $avatar },
                      "footer": { "text": "URNetwork Upstream Monitor • Critical Files" }
                    }]
                  }')
                  curl -sf -H "Content-Type: application/json" -d "$DISCORD_JSON" "$DISCORD_WEBHOOK"
                fi
              fi
            fi
          done

  monitor-all-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor all upstream PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          UPSTREAM_REPO="urnetwork/connect"

          echo "Fetching recently updated PRs from $UPSTREAM_REPO..."
          PRS=$(gh api repos/$UPSTREAM_REPO/pulls?state=open\&sort=updated\&direction=desc\&per_page=5)

          TWELVE_HOURS_AGO=$(date -u -d "12 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

          echo "$PRS" | jq -c '.[]' | while read -r pr; do
            PR_NUMBER=$(echo "$pr" | jq -r '.number')
            PR_TITLE=$(echo "$pr" | jq -r '.title')
            PR_URL=$(echo "$pr" | jq -r '.html_url')
            PR_UPDATED=$(echo "$pr" | jq -r '.updated_at')
            PR_AUTHOR=$(echo "$pr" | jq -r '.user.login')
            PR_AVATAR=$(echo "$pr" | jq -r '.user.avatar_url')

            if [[ "$PR_UPDATED" > "$TWELVE_HOURS_AGO" ]]; then
              echo "📢 New/Updated PR: #$PR_NUMBER by $PR_AUTHOR"

              if [ -n "$DISCORD_WEBHOOK" ]; then
                DISCORD_JSON=$(jq -n \
                  --arg url "$PR_URL" \
                  --arg prTitle "$PR_TITLE" \
                  --arg author "$PR_AUTHOR" \
                  --arg avatar "$PR_AVATAR" \
                '{
                  "embeds": [{
                    "title": "📢 Upstream PR Activity",
                    "url": $url,
                    "description": ("**PR:** [" + $prTitle + "](" + $url + ")\n**Author:** " + $author),
                    "color": 3447003,
                    "thumbnail": { "url": $avatar },
                    "footer": { "text": "URNetwork Upstream Monitor • All PRs" }
                  }]
                }')
                curl -sf -H "Content-Type: application/json" -d "$DISCORD_JSON" "$DISCORD_WEBHOOK"
              fi
            fi
          done

  monitor-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor upstream commits to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          UPSTREAM_REPO="urnetwork/connect"

          # Critical files to watch in commits
          CRITICAL_FILES=(
            "ip.go"
            "transfer.go"
            "transfer_contract_manager.go"
            "transfer_route_manager.go"
            "net_http.go"
            "net_http_doh.go"
            "transport.go"
            "transfer_encrypt.go"
            "provider/main.go"
            "proxy_health.go"
            "message_pool.go"
          )

          echo "Fetching recent commits to $UPSTREAM_REPO/main..."

          # Fetch last 20 commits to main
          COMMITS=$(gh api repos/$UPSTREAM_REPO/commits?sha=main\&per_page=20)

          TWELVE_HOURS_AGO=$(date -u -d "12 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

          echo "$COMMITS" | jq -c '.[]' | while read -r commit; do
            COMMIT_SHA=$(echo "$commit" | jq -r '.sha' | cut -c1-8)
            COMMIT_MSG=$(echo "$commit" | jq -r '.commit.message' | head -1)
            COMMIT_URL=$(echo "$commit" | jq -r '.html_url')
            COMMIT_AUTHOR=$(echo "$commit" | jq -r '.commit.author.name')
            COMMIT_DATE=$(echo "$commit" | jq -r '.commit.author.date')

            if [[ "$COMMIT_DATE" > "$TWELVE_HOURS_AGO" ]]; then
              COMMIT_FILES=$(gh api repos/$UPSTREAM_REPO/commits/$COMMIT_SHA | jq -r '.files[].filename')

              MATCHED_FILES=""
              for file in "${CRITICAL_FILES[@]}"; do
                if echo "$COMMIT_FILES" | grep -q "^$file$"; then
                  MATCHED_FILES="$MATCHED_FILES \`$file\`"
                fi
              done

              if [ -n "$MATCHED_FILES" ]; then
                echo "✅ MERGED: Commit $COMMIT_SHA touches:$MATCHED_FILES"

                if [ -n "$DISCORD_WEBHOOK" ]; then
                  DISCORD_JSON=$(jq -n \
                    --arg url "$COMMIT_URL" \
                    --arg sha "$COMMIT_SHA" \
                    --arg msg "$COMMIT_MSG" \
                    --arg author "$COMMIT_AUTHOR" \
                    --arg files "$MATCHED_FILES" \
                  '{
                    "embeds": [{
                      "title": "✅ Upstream Commit to Main (Critical Files)",
                      "url": $url,
                      "description": ("**Commit:** `" + $sha + "`\n**Author:** " + $author + "\n**Message:** " + $msg + "\n\n**Modified Files:**\n" + $files),
                      "color": 65280,
                      "footer": { "text": "URNetwork Upstream Monitor • Merged" }
                    }]
                  }')
                  curl -sf -H "Content-Type: application/json" -d "$DISCORD_JSON" "$DISCORD_WEBHOOK"
                fi
              fi
            fi
          done
