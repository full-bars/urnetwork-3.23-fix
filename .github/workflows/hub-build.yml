name: Build and Push Hub Image

on:
  push:
    branches:
      - main
    paths:
      - 'hub/**'
      - '.github/workflows/hub-build.yml'
    tags:
      - 'hub-v*'
  pull_request:
    branches:
      - main
    paths:
      - 'hub/**'
      - '.github/workflows/hub-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-hub
  DOCKER_IMAGE_NAME: 3cape/urnetwork-hub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=hub-v(.*),group=1
            type=ref,event=pr
            type=sha,format=short

      - name: Determine version for build
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/hub-v* ]]; then
            VERSION="${GITHUB_REF_NAME#hub-}"
          else
            # Independent of the provider's v3.23.0-fix.X.Y scheme — the hub
            # versions itself starting at v0.1.0, tagged as hub-vX.Y.Z.
            VERSION=$(git describe --tags --match 'hub-v*' --abbrev=0 2>/dev/null | sed 's/^hub-//' || true)
            VERSION="${VERSION:-v0.1.0-dev}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=min,scope=hub

      - name: Notify Discord on tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/hub-v') }}
        env:
          BUILD_NOTIFY: ${{ secrets.BUILD_NOTIFY }}
        run: |
          if [ -z "$BUILD_NOTIFY" ]; then
            echo "BUILD_NOTIFY secret is not set, skipping notification"
            exit 0
          fi
          VERSION="${{ steps.version.outputs.VERSION }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -H "Content-Type: application/json" -d "$(jq -n \
            --arg version "$VERSION" \
            --arg runUrl "$RUN_URL" \
          '{
            "embeds": [{
              "title": ("📊 Hub Image Published — " + $version),
              "description": ("**Platforms:** linux/amd64, linux/arm64\n\n**Pull:**\n```\ndocker pull ghcr.io/full-bars/urnetwork-3.23-fix-hub:" + $version + "\ndocker pull 3cape/urnetwork-hub:" + $version + "\n```\n\n[View build run](" + $runUrl + ")"),
              "color": 3447003,
              "footer": { "text": "URNetwork Release Monitor • Hub" }
            }]
          }')" "$BUILD_NOTIFY"

  release:
    name: Create Hub Binary Release
    if: ${{ startsWith(github.ref, 'refs/tags/hub-v') }}
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build hub binary
        run: |
          VERSION=${GITHUB_REF_NAME:-hub-v0.1.0}
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -trimpath \
          -ldflags "-s -w -X main.Version=${VERSION}" \
          -o urnetwork-hub-${VERSION}-linux-${{ matrix.goarch }} ./hub/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-bin-${{ matrix.goarch }}
          path: urnetwork-hub-*-linux-${{ matrix.goarch }}

  github-release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/hub-v') }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: hub-bin-amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: hub-bin-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            urnetwork-hub-*-linux-amd64
            urnetwork-hub-*-linux-arm64
          draft: false
          prerelease: false
          generate_release_notes: true
