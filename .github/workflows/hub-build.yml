name: Build and Push Hub Image

on:
  push:
    branches:
      - main
    paths:
      - 'hub/**'
      - '.github/workflows/hub-build.yml'
    tags:
      - 'hub-docker-v*'
  pull_request:
    branches:
      - main
    paths:
      - 'hub/**'
      - '.github/workflows/hub-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-hub
  DOCKER_IMAGE_NAME: 3cape/urnetwork-hub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=hub-docker-v(.*),group=1
            type=ref,event=pr
            type=sha,format=short

      - name: Determine version for build
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/hub-docker-v* ]]; then
            VERSION="${GITHUB_REF_NAME#hub-docker-}"
          else
            VERSION=$(git describe --tags --match 'hub-docker-v*' --abbrev=0 2>/dev/null | sed 's/^hub-docker-//' || true)
            VERSION="${VERSION:-v0.1.0-dev}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=min,scope=hub

      - name: Notify Discord on tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/hub-docker-v') }}
        env:
          BUILD_NOTIFY: ${{ secrets.BUILD_NOTIFY }}
        run: |
          if [ -z "$BUILD_NOTIFY" ]; then
            echo "BUILD_NOTIFY secret is not set, skipping notification"
            exit 0
          fi
          VERSION="${{ steps.version.outputs.VERSION }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -H "Content-Type: application/json" -d "$(jq -n \
            --arg version "$VERSION" \
            --arg runUrl "$RUN_URL" \
          '{
            "embeds": [{
              "title": ("Hub Docker Image Published — " + $version),
              "description": ("**Platforms:** linux/amd64, linux/arm64\n\n**Pull:**\n```\ndocker pull ghcr.io/full-bars/urnetwork-3.23-fix-hub:" + $version + "\n```\n```\ndocker pull 3cape/urnetwork-hub:" + $version + "\n```\n\n[View build run](" + $runUrl + ")"),
              "color": 3447003,
              "footer": { "text": "URNetwork Release Monitor • Hub Docker" }
            }]
          }')" "$BUILD_NOTIFY"
