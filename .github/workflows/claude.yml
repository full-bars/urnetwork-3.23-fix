name: PR Review Trigger

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
# nothing personal
          # On issue_comment events github.event.pull_request is null, so
          # resolve the PR head SHA via the API using the PR number from the
          # comment's issue context.
          PR_NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
          echo "pr_number=$PR_NUM"
          SHA=$(gh api repos/${{ github.repository }}/pulls/$PR_NUM --jq .head.sha)
          echo "head_sha=$SHA"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_sha }}
      - name: Run review agent on mention
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model sonnet
