name: Dash/POSIX Compatibility

# The Linux installer (scripts/Provider_Install_Linux.sh, aka urnet-tools) is
# intended to run under dash via `#!/bin/sh`. This guard keeps it that way:
# it rejects bashisms in the installer and any published instruction that pipes
# the installer to bash instead of sh.

on:
  push:
    branches:
      - main
      - fix/v3.23-custom
  pull_request:
    branches:
      - main
      - fix/v3.23-custom
  workflow_dispatch:

jobs:
  dash-compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Installer scripts must target POSIX sh (#!/bin/sh)
        run: |
          status=0
          for s in scripts/Provider_Install_Linux.sh scripts/Provider_Install_Deps.sh scripts/Provider_Uninstall_Linux.sh; do
            [ -f "$s" ] || continue
            shebang=$(head -n 1 "$s")
            if [ "$shebang" != "#!/bin/sh" ]; then
              echo "::error file=$s::shebang is '$shebang', must be '#!/bin/sh' (installer targets dash)"
              status=1
            fi
          done
          exit $status

      - name: Published install one-liner must pipe to sh, not bash
        run: |
          # The installer is dash-targeted, so published instructions must use '| sh'.
          # releases/v3.23.0-beta.1.md is grandfathered and intentionally left as-is.
          matches=$(grep -rnE 'Provider_Install_Linux\.sh[[:space:]]*\|[[:space:]]*bash' \
            README.md docs releases 2>/dev/null \
            | grep -v 'releases/v3.23.0-beta.1.md' || true)
          if [ -n "$matches" ]; then
            echo "::error::Install instructions pipe the dash installer to bash. Use '| sh':"
            echo "$matches"
            exit 1
          fi
          echo "OK: no installer-to-bash pipes found."

      - name: Parse installer scripts under dash
        run: |
          status=0
          for s in scripts/Provider_Install_Linux.sh scripts/Provider_Install_Deps.sh scripts/Provider_Uninstall_Linux.sh; do
            [ -f "$s" ] || continue
            if ! dash -n "$s"; then
              echo "::error file=$s::failed to parse under dash"
              status=1
            fi
          done
          exit $status

      - name: Lint installer scripts for bashisms
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq devscripts >/dev/null
          status=0
          for s in scripts/Provider_Install_Linux.sh scripts/Provider_Install_Deps.sh scripts/Provider_Uninstall_Linux.sh; do
            [ -f "$s" ] || continue
            echo "=== $s ==="
            out=$(checkbashisms -f "$s" 2>&1 || true)
            printf '%s\n' "$out"
            # 'ulimit' is a dash builtin and these scripts target dash, so allow it.
            remaining=$(printf '%s\n' "$out" | grep -i 'possible bashism' | grep -v '(ulimit)' || true)
            if [ -n "$remaining" ]; then
              echo "::error file=$s::non-dash-safe bashism found (see log above)"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then exit 1; fi
          echo "OK: installer scripts are dash-safe (ulimit allowed as a dash builtin)."
