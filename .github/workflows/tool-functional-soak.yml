name: tool-functional-soak

on:
  # Manual-only: a 3h test should not auto-fire on every push (a push +
  # manual trigger doubles it). Dispatch deliberately when a soak is wanted.
  workflow_dispatch:

jobs:
  functional-soak:
    name: Linux functional soak (accelerated, ~3h)
    runs-on: ubuntu-latest
    timeout-minutes: 200  # 3h20m; job cap is 360
    env:
      GAUNTLET_USER: ${{ secrets.GAUNTLET_USER }}
      GAUNTLET_PW: ${{ secrets.GAUNTLET_PW }}
      # Accelerated schedule: compress the pool-stabilization timeline so
      # proxies warm up in ~1-2h instead of 6h+. These are TEST-ONLY knobs;
      # they are not the production defaults.
      URNETWORK_PROXY_BENCHMARK: "true"
      URNETWORK_SELF_HEAL: "1"
      PROXY_URL_REFRESH: "2m"
      URNETWORK_HEARTBEAT_INTERVAL: "15s"
      URNETWORK_REPORT_INTERVAL: "1m"
      # Tight cap on URL-sourced proxies: keeps the runner's external-IP
      # footprint small and contained (ToS-conscious), while still loading
      # enough of a real pool to observe admission/grading/stabilization.
      PROXY_URL_MAX: "25"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build provider + tool
        run: |
          go build -o /tmp/provider ./provider/
          go build -o /tmp/urnet-tools ./cmd/urnet-tools/

      - name: Mint a real JWT (gauntlet account)
        run: |
          mkdir -p /tmp/mint
          HOME=/tmp/mint /tmp/provider auth \
            --user_auth="$GAUNTLET_USER" --password="$GAUNTLET_PW" \
            --api_url=https://api.bringyour.com -f 2>&1 | grep -vE '^I[0-9]{4}'
          test -s /tmp/mint/.urnetwork/jwt || { echo "JWT mint failed — see auth output above"; exit 1; }
          if grep -qE '"(network_id|name)"\s*:\s*"(production|full-bars)"' /tmp/mint/.urnetwork/network.json 2>/dev/null; then
            echo "REFUSING: production account"; exit 1
          fi
          echo "JWT minted OK"

      - name: Set up state dir + accelerated grade config + pre-write source
        run: |
          mkdir -p "$HOME/.urnetwork"
          cp /tmp/mint/.urnetwork/jwt "$HOME/.urnetwork/jwt"
          # Compress the stage-1 probe cadence (test-only, re-read live).
          cat > "$HOME/.urnetwork/proxy_grades.json" << 'EOF'
          {
            "interval_sec": 60,
            "sample_width": 6,
            "pass_bar": 0.5,
            "stale_calm": "30m",
            "stale_hot": "15m"
          }
          EOF
          # Pre-write the URL source into the state file BEFORE the provider
          # starts. provide() merges persisted Sources (resolveProxyURLs), so
          # the background fetcher loads under --proxy_url_max=25 from the
          # very first cycle — no add-source one-shot (maxTotal=0) ever runs,
          # so the cap cannot be bypassed. This is also the real operator
          # flow: configure the source once, provider picks it up on every
          # restart.
          cat > "$HOME/.urnetwork/proxy_url.json" << 'EOF'
          {
            "sources": ["https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt"],
            "cache": {}
          }
          EOF
          echo "state + accelerated config + pre-written source ready"

      - name: Start provider (real session, accelerated, capped)
        run: |
          # No --proxy_url flag needed: the persisted source in
          # proxy_url.json is merged by resolveProxyURLs. The cap is set via
          # env so the running fetcher honors it from the first cycle.
          nohup /tmp/provider provide > /tmp/provider.log 2>&1 &
          echo $! > /tmp/provider.pid
          sleep 30
          if kill -0 $(cat /tmp/provider.pid) 2>/dev/null; then
            echo "provider running (pid $(cat /tmp/provider.pid))"
          else
            tail -30 /tmp/provider.log; exit 1
          fi

      - name: Basic tool commands
        run: |
          /tmp/urnet-tools providers
          /tmp/urnet-tools status
          /tmp/urnet-tools version

      # ---- Soak block 1: 50 min pool observation ----
      - name: Soak block 1 (50 min pool observation)
        run: |
          for i in $(seq 1 10); do
            echo "--- block1 window $i @ $(date -u +%T) ---"
            /tmp/urnet-tools proxy health 2>/dev/null | head -5 || true
            /tmp/urnet-tools providers
            sleep 300
          done

      - name: Restart cycle 1 (client-ID reuse check)
        run: |
          echo "client_id before: $(grep -o 'client_id[^,]*' "$HOME/.urnetwork/jwt" 2>/dev/null | head -c 40)"
          /tmp/urnet-tools hot-restart || echo "hot-restart nonzero"
          sleep 30
          echo "client_id after: $(grep -o 'client_id[^,]*' "$HOME/.urnetwork/jwt" 2>/dev/null | head -c 40)"
          /tmp/urnet-tools providers

      # ---- Soak block 2: 50 min pool observation ----
      - name: Soak block 2 (50 min pool observation)
        run: |
          for i in $(seq 1 10); do
            echo "--- block2 window $i @ $(date -u +%T) ---"
            /tmp/urnet-tools proxy health 2>/dev/null | head -5 || true
            /tmp/urnet-tools providers
            sleep 300
          done

      - name: Restart cycle 2 (client-ID reuse check)
        run: |
          echo "client_id before: $(grep -o 'client_id[^,]*' "$HOME/.urnetwork/jwt" 2>/dev/null | head -c 40)"
          /tmp/urnet-tools hot-restart || echo "hot-restart nonzero"
          sleep 30
          echo "client_id after: $(grep -o 'client_id[^,]*' "$HOME/.urnetwork/jwt" 2>/dev/null | head -c 40)"
          /tmp/urnet-tools providers

      # ---- Soak block 3: 50 min pool observation ----
      - name: Soak block 3 (50 min pool observation)
        run: |
          for i in $(seq 1 10); do
            echo "--- block3 window $i @ $(date -u +%T) ---"
            /tmp/urnet-tools proxy health 2>/dev/null | head -5 || true
            /tmp/urnet-tools providers
            sleep 300
          done

      - name: Remint cycle (new client ID check)
        run: |
          echo "client_id before: $(grep -o 'client_id[^,]*' "$HOME/.urnetwork/jwt" 2>/dev/null | head -c 40)"
          rm -f "$HOME/.urnetwork/jwt"
          HOME="$HOME/.urnetwork" /tmp/provider auth \
            --user_auth="$GAUNTLET_USER" --password="$GAUNTLET_PW" \
            --api_url=https://api.bringyour.com -f 2>&1 | grep -vE '^I[0-9]{4}' || true
          sleep 10
          echo "client_id after remint: $(grep -o 'client_id[^,]*' "$HOME/.urnetwork/jwt" 2>/dev/null | head -c 40)"
          /tmp/urnet-tools providers

      - name: proxy clear + final restart
        run: |
          /tmp/urnet-tools proxy clear || echo "clear nonzero"
          /tmp/urnet-tools hot-restart || echo "hot-restart nonzero"
          sleep 20
          /tmp/urnet-tools providers

      - name: Teardown
        run: |
          kill $(cat /tmp/provider.pid) 2>/dev/null || true
          echo "--- provider log tail ---"
          tail -30 /tmp/provider.log 2>/dev/null || true
          echo "--- provider log: errors during soak ---"
          grep -iE "error|panic|fatal|oom" /tmp/provider.log 2>/dev/null | tail -10 || echo "no errors logged"
        if: always()
