name: CFAA Blocklist Sync

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cfaa-sync-request]

concurrency:
  group: cfaa-blocklist-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream blocklists
        uses: actions/github-script@v7
        id: fetch
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            const upstreamRepo = 'urnetwork/connect';

            // Both tables come from upstream's security pipeline and are never
            // hand-edited in the fork. Syncing only the CFAA file left
            // ip_blocker_block.go drifting, so the pair moves together now.
            const files = [
              { name: 'ip_security_cfaa_block.go' },
              { name: 'ip_blocker_block.go' },
            ];

            execSync(`git fetch --depth=1 https://github.com/${upstreamRepo}.git HEAD`, { stdio: 'pipe' });
            const sha = execSync('git rev-parse FETCH_HEAD', { encoding: 'utf-8' }).trim();

            // The tables are multi-megabyte single lines, so read them from disk.
            for (const f of files) {
              const tmp = `/tmp/upstream_${f.name}`;
              execSync(`git show ${sha}:${f.name} > ${tmp}`, { stdio: 'pipe' });
              f.upstream = fs.readFileSync(tmp, 'utf-8');
              f.fork = fs.readFileSync(f.name, 'utf-8');
              f.identical = f.upstream === f.fork;
            }

            const extractConst = (content, name) => {
              const m = content.match(new RegExp(name + '\\s*=\\s*(\\d+)'));
              return m ? parseInt(m[1], 10) : 0;
            };

            const cfaa = files[0];
            const blocker = files[1];

            const cfaaUpV4 = extractConst(cfaa.upstream, 'cfaaBlockedPrefixCount');
            const cfaaUpV6 = extractConst(cfaa.upstream, 'cfaaBlockedPrefix6Count');
            const cfaaForkV4 = extractConst(cfaa.fork, 'cfaaBlockedPrefixCount');
            const cfaaForkV6 = extractConst(cfaa.fork, 'cfaaBlockedPrefix6Count');
            const blockerUpHosts = extractConst(blocker.upstream, 'blockerBlockedHostCount');
            const blockerForkHosts = extractConst(blocker.fork, 'blockerBlockedHostCount');

            const allIdentical = cfaa.identical && blocker.identical;

            console.log(`Upstream SHA: ${sha}`);
            console.log(`CFAA:  fork v4=${cfaaForkV4} v6=${cfaaForkV6} -> upstream v4=${cfaaUpV4} v6=${cfaaUpV6} identical=${cfaa.identical}`);
            console.log(`BLOCK: fork hosts=${blockerForkHosts} -> upstream hosts=${blockerUpHosts} identical=${blocker.identical}`);

            core.setOutput('upstream_sha', sha);
            core.setOutput('upstream_v4', cfaaUpV4);
            core.setOutput('upstream_v6', cfaaUpV6);
            core.setOutput('fork_v4', cfaaForkV4);
            core.setOutput('fork_v6', cfaaForkV6);
            core.setOutput('upstream_hosts', blockerUpHosts);
            core.setOutput('fork_hosts', blockerForkHosts);
            core.setOutput('cfaa_identical', cfaa.identical);
            core.setOutput('blocker_identical', blocker.identical);
            core.setOutput('files_identical', allIdentical);

      - name: Write sync info JSON
        run: bash .github/scripts/write_sync_info.sh "${{ steps.fetch.outputs.upstream_sha }}" "${{ steps.fetch.outputs.upstream_v4 }}" "${{ steps.fetch.outputs.upstream_v6 }}" "${{ steps.fetch.outputs.fork_v4 }}" "${{ steps.fetch.outputs.fork_v6 }}" "${{ steps.fetch.outputs.files_identical }}" "${{ steps.fetch.outputs.upstream_hosts }}" "${{ steps.fetch.outputs.fork_hosts }}" "${{ steps.fetch.outputs.cfaa_identical }}" "${{ steps.fetch.outputs.blocker_identical }}"

      - name: Skip if no changes needed
        if: steps.fetch.outputs.files_identical == 'true'
        run: |
          echo "Both blocklists are already in sync. Nothing to do."

      - name: Import GPG key
        if: steps.fetch.outputs.files_identical == 'false'
        env:
          GPG_RELEASE_KEY: ${{ secrets.GPG_RELEASE_KEY }}
        run: |
          if [ -z "$GPG_RELEASE_KEY" ]; then
            echo "ERROR: GPG_RELEASE_KEY secret not set. Cannot sign commits."
            exit 1
          fi
          echo "$GPG_RELEASE_KEY" | gpg --batch --import 2>&1
          SIGNING_KEY=$(gpg --list-keys --keyid-format long meso-release-bot 2>&1 | awk '/^pub/{print $2}' | cut -d/ -f2)
          if [ -z "$SIGNING_KEY" ]; then
            echo "ERROR: Could not extract GPG key ID after import."
            exit 1
          fi
          git config user.signingkey "$SIGNING_KEY"
          git config commit.gpgsign true
          echo "GPG signing key configured: $SIGNING_KEY"

      - name: Create branch and apply changes
        if: steps.fetch.outputs.files_identical == 'false'
        run: bash .github/scripts/cfaa_sync.sh "${{ steps.fetch.outputs.upstream_sha }}" "${{ steps.fetch.outputs.upstream_v4 }}" "${{ steps.fetch.outputs.upstream_v6 }}" "${{ steps.fetch.outputs.fork_v4 }}" "${{ steps.fetch.outputs.fork_v6 }}" "${{ steps.fetch.outputs.upstream_hosts }}" "${{ steps.fetch.outputs.fork_hosts }}" "${{ steps.fetch.outputs.cfaa_identical }}" "${{ steps.fetch.outputs.blocker_identical }}"

      - name: Push and open PR
        if: steps.fetch.outputs.files_identical == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/create_pr.sh

      - name: Post confirmation to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            python3 .github/scripts/cfaa_sync_notify.py
          else
            echo "DISCORD_WEBHOOK not set, skipping notification"
          fi
