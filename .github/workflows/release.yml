name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go module download
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-

      - name: Build provider
        run: |
          VERSION=${GITHUB_REF_NAME:-v3.23.0-fix.1}
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -trimpath \
          -ldflags "-s -w -X main.Version=${VERSION}" \
          -o bin/${{ matrix.goos }}/${{ matrix.goarch }}/provider ./provider/

      - name: Build hub
        run: |
          VERSION=${GITHUB_REF_NAME:-v3.23.0-fix.1}
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -trimpath \
          -ldflags "-s -w -X main.Version=${VERSION}" \
          -o bin/${{ matrix.goos }}/${{ matrix.goarch }}/hub ./hub/

      - name: Upload provider artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-${{ matrix.goarch }}
          path: bin/${{ matrix.goos }}/${{ matrix.goarch }}/provider

      - name: Upload hub artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.goarch }}
          path: bin/${{ matrix.goos }}/${{ matrix.goarch }}/hub

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download provider amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: provider-amd64
          path: release_tmp/linux/amd64/

      - name: Download provider arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: provider-arm64
          path: release_tmp/linux/arm64/

      - name: Download hub amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: hub-amd64
          path: hub_tmp/amd64/

      - name: Download hub arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: hub-arm64
          path: hub_tmp/arm64/

      - name: Prepare binaries
        run: |
          VERSION=${GITHUB_REF_NAME:-latest}
          # download-artifact@v4 might create subfolders or keep names depending on structure
          # Ensuring provider binaries are named 'provider' in the correct structure
          find release_tmp -name "provider*" -type f -exec chmod +x {} \;
          mv release_tmp/linux/amd64/provider-amd64 release_tmp/linux/amd64/provider 2>/dev/null || true
          mv release_tmp/linux/arm64/provider-arm64 release_tmp/linux/arm64/provider 2>/dev/null || true
          # Stamp hub binaries with version and arch for individual asset upload
          find hub_tmp -name "hub*" -type f -exec chmod +x {} \;
          mv hub_tmp/amd64/hub-amd64 hub_tmp/amd64/hub 2>/dev/null || true
          mv hub_tmp/arm64/hub-arm64 hub_tmp/arm64/hub 2>/dev/null || true
          cp hub_tmp/amd64/hub urnetwork-hub-${VERSION}-linux-amd64
          cp hub_tmp/arm64/hub urnetwork-hub-${VERSION}-linux-arm64

      - name: Create provider tarball
        run: |
          VERSION=${GITHUB_REF_NAME:-latest}
          cd release_tmp
          tar -czf ../urnetwork-provider-${VERSION}.tar.gz linux/
          cd ..

      - name: Set release body source
        id: body_src
        run: |
          CUSTOM="releases/${GITHUB_REF_NAME}.md"
          if [ -f "$CUSTOM" ]; then
            echo "path=${CUSTOM}" >> "$GITHUB_OUTPUT"
            echo "auto=false" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "auto=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            urnetwork-provider-*.tar.gz
            urnetwork-hub-*-linux-amd64
            urnetwork-hub-*-linux-arm64
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          body_path: ${{ steps.body_src.outputs.path }}
          generate_release_notes: ${{ steps.body_src.outputs.auto }}

      - name: Notify Discord on tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          BUILD_NOTIFY: ${{ secrets.BUILD_NOTIFY }}
        run: |
          if [ -z "$BUILD_NOTIFY" ]; then
            echo "BUILD_NOTIFY secret is not set, skipping notification"
            exit 0
          fi
          VERSION="${{ github.ref_name }}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          curl -sf -H "Content-Type: application/json" -d "$(jq -n \
            --arg version "$VERSION" \
            --arg releaseUrl "$RELEASE_URL" \
          '{
            "embeds": [{
              "title": ("🎉 Release " + $version + " is Live"),
              "description": ("**Binaries:** linux/amd64, linux/arm64\n\n**Update existing install:**\n```\nurnet-tools update\n```\n\n**Fresh install:**\n```\ncurl -fSsL https://raw.githubusercontent.com/full-bars/urnetwork-3.23-fix/refs/heads/main/scripts/Provider_Install_Linux.sh | sh -s -- install\n```\n\n[View GitHub Release](" + $releaseUrl + ")"),
              "color": 3066993,
              "footer": { "text": "URNetwork Release Monitor • Binaries" }
            }]
          }')" "$BUILD_NOTIFY"
