name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - fix/v3.23-custom
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - fix/v3.23-custom
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_IMAGE_NAME: 3cape/urnetwork-3.23-fix

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run Installer Script Tests
        run: |
          chmod +x scripts/test_provider_install.sh
          ./scripts/test_provider_install.sh

      - name: Run Fallback Logic Tests
        run: |
          chmod +x scripts/test_fallback_logic.sh
          ./scripts/test_fallback_logic.sh

      - name: Run Go Unit Tests
        run: |
          go test -v -timeout 60s -run "TestShouldLogSelectErr|TestProxyHealth|TestUnregisterProxy|TestByteCount|TestIdJson|TestIdOrder|TestMultiHopId|TestTransferPath|TestAddrGenerator|TestAddrsInPrefix|TestIpsInNet|TestClientKeyManager|TestCanonicalCert|TestVerifyClientKey|TestTransferQueue|TestRttWindow|TestBase64|TestMessagePool$|TestDnsRequest|TestDnsResponse|TestCombine|TestPump|TestWakeupTime|TestApplyAutoTuning|TestSelectTier" .
          go test -v -timeout 120s ./provider/...
          go test -v -timeout 30s ./hub/...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=match,pattern=v3\.23\.0-fix\.(.*),group=1
            type=ref,event=branch
            type=sha,format=short

      - name: Determine version for build
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            # For main branch, get the most recent tag
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v3.23.0-fix.1")
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
