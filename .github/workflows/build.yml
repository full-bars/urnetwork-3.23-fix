name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - fix/v3.23-custom
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - fix/v3.23-custom
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_IMAGE_NAME: 3cape/urnetwork-3.23-fix

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: v2-${{ runner.os }}-gobuild-${{ hashFiles('go.sum') }}
          restore-keys: |
            v2-${{ runner.os }}-gobuild-

      - name: Cache Go module download
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: v2-${{ runner.os }}-gomod-${{ hashFiles('go.sum') }}
          restore-keys: |
            v2-${{ runner.os }}-gomod-

      - name: Run Go Unit Tests
        run: |
          # Full suite across all packages with the race detector. The slow
          # transport/transfer integration tests self-skip under -short via
          # their testing.Short() guards, so this stays CI-fast (~2-4 min) while
          # ./... auto-discovers new tests (the suite can no longer silently
          # drift out of coverage the way the old -run allowlist did). -race
          # gates concurrency regressions such as the message-pool reference
          # count race.
          go test -short -race -timeout 600s ./...

      - name: Run go vet
        run: |
          go vet .
          go vet ./provider/...
          go vet ./hub/...

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check hot-path verbose logging guards
        run: |
          # Tier-1 hot-path files must not grow new unguarded V(n).Inf* calls.
          # Baseline 58 = the sanctioned Tier-2 sites (per-connection/per-handshake)
          # that Task 17 deliberately leaves unguarded; anything above that is a
          # new per-packet/per-message site that must be wrapped. A future Tier-2
          # sweep PR must update this baseline.
          expected=58
          found=$(grep -nE '^[^/]*\.V\([0-9]\)\.Inf' ip.go transfer.go ip_remote_multi_client.go | wc -l)
          if [ "$found" -gt "$expected" ]; then
            echo "unguarded V(n).Inf* in a hot-path file (expected $expected sanctioned Tier-2 sites, found $found):"
            grep -nE '^[^/]*\.V\([0-9]\)\.Inf' ip.go transfer.go ip_remote_multi_client.go | tail -n +$((expected + 1))
            echo "wrap new sites with 'if v := log.V(n); v.Enabled()'"
            exit 1
          fi

      - name: Run Installer Script Tests
        run: |
          chmod +x scripts/test_provider_install.sh
          ./scripts/test_provider_install.sh

      - name: Run Fallback Logic Tests
        run: |
          chmod +x scripts/test_fallback_logic.sh
          ./scripts/test_fallback_logic.sh

      - name: Run vulnerability check
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=match,pattern=v3\.23\.0-fix\.(.*),group=1
            type=ref,event=branch
            type=sha,format=short

      - name: Determine version for build
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            # For main branch, get the most recent provider tag. Scoped to
            # v3.23.0-fix.* so unrelated tag schemes in this repo (e.g. the
            # hub's Docker-only hub-docker-vX.Y.Z tags) can never get picked up here.
            VERSION=$(git describe --tags --abbrev=0 --match 'v3.23.0-fix.*' 2>/dev/null || echo "v3.23.0-fix.1")
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Notify Discord on tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          BUILD_NOTIFY: ${{ secrets.BUILD_NOTIFY }}
        run: |
          if [ -z "$BUILD_NOTIFY" ]; then
            echo "BUILD_NOTIFY secret is not set, skipping notification"
            exit 0
          fi
          VERSION="${{ steps.version.outputs.VERSION }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -H "Content-Type: application/json" -d "$(jq -n \
            --arg version "$VERSION" \
            --arg runUrl "$RUN_URL" \
          '{
            "embeds": [{
              "title": ("🐳 Docker Image Published — " + $version),
              "description": ("**Platforms:** linux/amd64, linux/arm64\n\n**Pull:**\n```\ndocker pull ghcr.io/full-bars/urnetwork-3.23-fix:" + $version + "\n```\n```\ndocker pull 3cape/urnetwork-3.23-fix:" + $version + "\n```\n\n[View build run](" + $runUrl + ")"),
              "color": 2406797,
              "footer": { "text": "URNetwork Release Monitor • Docker" }
            }]
          }')" "$BUILD_NOTIFY"
