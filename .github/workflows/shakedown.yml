name: Pre-Release Shakedown

# Runs the full pre-release shakedown (fresh install -> auth -> Go tool ->
# proxies -> URL sources -> egress -> docker) on a free GitHub-hosted runner
# (ubuntu-latest), entirely free — no DigitalOcean. The GH runner IS the
# disposable clean box; the shakedown runs in a temp HOME like a fresh install.
#
# Triggers: manual dispatch, or automatically when a v3.23.0-fix.* tag is pushed.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v3.23.0-fix.*'

permissions:
  contents: read
  actions: read

jobs:
  shakedown:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # the shakedown itself targets ~110 min of work
    # Two runs share the same gauntlet account server-side. Queue, never cancel.
    concurrency:
      group: shakedown
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Resolve target release version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag-triggered runs test THE RELEASE BEING CUT (GITHUB_REF_NAME),
          # not whatever :latest happens to be. Manual runs default to the
          # last published release.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/full-bars/urnetwork-3.23-fix/releases/latest" \
              2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo "")
            VER="${VER:-v3.23.0-fix.30.7}"
          fi
          # Wait for the release build to COMPLETE before testing that tag.
          GITHUB_SHA_SHORT="${GITHUB_SHA}"
          ASSETS_OK=0
          REL_RUN_ID=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/full-bars/urnetwork-3.23-fix/actions/runs?event=push&head_sha=${GITHUB_SHA_SHORT}&per_page=20" \
            2>/dev/null | python3 -c "import sys,json;print(next((r.get('id','') for r in json.load(sys.stdin).get('workflow_runs',[]) if r.get('path')=='.github/workflows/release.yml'),''))" 2>/dev/null)
          if [ -n "$REL_RUN_ID" ]; then
            REL_JOB_CONC=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/full-bars/urnetwork-3.23-fix/actions/runs/${REL_RUN_ID}/jobs?per_page=50" \
              2>/dev/null | python3 -c "import sys,json;print(next((j.get('conclusion','') for j in json.load(sys.stdin).get('jobs',[]) if j.get('name')=='Create Release'),''))" 2>/dev/null)
            if echo "$REL_JOB_CONC" | grep -qE "failure|cancelled|timed_out|action_required"; then
              echo "::error::create-release job FAILED ($REL_JOB_CONC) — ENV_BLOCKER"
              echo "ENV_BLOCKER=1" >> "$GITHUB_OUTPUT"; echo 75 > /tmp/shakedown.exit; exit 75
            fi
          fi
          for i in $(seq 1 120); do
            if curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/full-bars/urnetwork-3.23-fix/releases/tags/${VER}" \
              2>/dev/null | grep -q '"browser_download_url"'; then
              ASSETS_OK=1; echo "release assets for ${VER} appeared"; break
            fi
            echo "waiting for release build of ${VER} (${i}/120)..."; sleep 30
          done
          if [ "$ASSETS_OK" != "1" ] && [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "::error::release assets for ${VER} never appeared within 60 min safety cap"
            echo "ENV_BLOCKER=1" >> "$GITHUB_OUTPUT"; echo 75 > /tmp/shakedown.exit; exit 75
          fi
          echo "EXPECTED_VERSION=${VER}" >> "$GITHUB_OUTPUT"
          echo "target release: ${VER}"

      - name: Mint disposable JWT from secrets
        id: mint
        env:
          GAUNTLET_USER: ${{ secrets.GAUNTLET_USER }}
          GAUNTLET_PW: ${{ secrets.GAUNTLET_PW }}
          GOPROXY: "https://proxy.golang.org|https://goproxy.io,direct"
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."; go build -ldflags "-X main.Version=shakedown-mint" -o /tmp/provider ./provider/ && break
            if [ $attempt -lt 3 ]; then echo "Build failed, retrying in 10s..."; sleep 10; else echo "Build failed after 3 attempts"; exit 1; fi
          done
          mkdir -p /tmp/mint
          HOME=/tmp/mint /tmp/provider auth --user_auth="$GAUNTLET_USER" --password="$GAUNTLET_PW" --api_url=https://api.bringyour.com -f 2>&1 | grep -vE '^I[0-9]{4}' || true
          test -s /tmp/mint/.urnetwork/jwt || { echo "JWT mint failed (verification required?)"; exit 1; }
          cp /tmp/mint/.urnetwork/jwt /tmp/gauntlet.jwt
          python3 - << 'PY'
          import base64, json
          raw = open('/tmp/gauntlet.jwt').read().strip()
          p = raw.split('.')[1] + '=' * (-len(raw.split('.')[1]) % 4)
          d = json.loads(base64.urlsafe_b64decode(p))
          print("account:", d.get('network_name'))
          if d.get('network_name') == 'mesocyclone':
              raise SystemExit("REFUSING: minted JWT is the production account")
          PY

      - name: Syntax-check shakedown script
        run: |
          bash -n .github/scripts/shakedown.sh || { echo "::error::shakedown.sh syntax error"; exit 1; }
          python3 -c "import ast; ast.parse(open('.github/scripts/shakedown-sweep.py').read())" || { echo "::error::shakedown-sweep.py syntax error"; exit 1; }

      - name: Run shakedown on the GH runner
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.EXPECTED_VERSION }}
        run: |
          # The GH runner IS the disposable clean box. Run the shakedown's
          # fresh-install flow in a temp HOME, no DigitalOcean.
          set +e
          RUN_HOME=$(mktemp -d)
          HOME="$RUN_HOME" bash .github/scripts/shakedown.sh /tmp/gauntlet.jwt > /tmp/shakedown.out 2>&1
          SHAKE_EXIT=$?
          set -e
          echo "::group::Shakedown Report"
          cat /tmp/shakedown-report.txt 2>/dev/null || echo "(no report)"
          echo "::endgroup::"
          echo "shakedown exit: $SHAKE_EXIT"
          REPORT_FAILS=$(grep -c "^FAIL:" /tmp/shakedown-report.txt 2>/dev/null || true)
          if [ "$SHAKE_EXIT" = "0" ] && [ "${REPORT_FAILS:-0}" -gt 0 ]; then
            echo "::error::shakedown reported $REPORT_FAILS FAIL(s) but exited 0 — RELEASE_BLOCKED"
            SHAKE_EXIT=1
          fi
          echo "$SHAKE_EXIT" > /tmp/shakedown.exit
          if [ "$SHAKE_EXIT" -eq 75 ]; then
            echo "::error::ENV_BLOCKER (rc=75) — shakedown did NOT run the release. NOT a pass."
            exit 75
          fi
          exit $SHAKE_EXIT
      - name: AI review of shakedown report
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          REPORT_TEXT=$(cat /tmp/shakedown-report.txt 2>/dev/null || echo "no report")
          SHAKE_EXIT=$(cat /tmp/shakedown.exit 2>/dev/null || echo "MISSING")
          if [ "$SHAKE_EXIT" = "MISSING" ]; then SHAKE_EXIT=124; fi
          if [ "$SHAKE_EXIT" = "75" ]; then DET="ENV_BLOCKER"
          elif echo "$REPORT_TEXT" | grep -q "TIER1_FAIL=1"; then DET="RELEASE_BLOCKED"
          elif [ -n "$SHAKE_EXIT" ] && [ "$SHAKE_EXIT" != "0" ]; then DET="RELEASE_BLOCKED"
          else DET="RELEASE_OK"; fi
          echo "DETERMINISTIC_VERDICT=$DET" > /tmp/shakedown-ai-review.txt
          echo "PASS=$(echo "$REPORT_TEXT" | grep -c '^PASS:' || true)"
          echo "FAIL=$(echo "$REPORT_TEXT" | grep -c '^FAIL:' || true)"
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "AI_REVIEW_STATUS=SKIPPED" >> /tmp/shakedown-ai-review.txt
            echo "AI review skipped (no GEMINI_API_KEY); deterministic verdict: $DET" >> /tmp/shakedown-ai-review.txt
            cat /tmp/shakedown-ai-review.txt
            exit 0
          fi
          echo "AI_REVIEW_STATUS=OK" >> /tmp/shakedown-ai-review.txt
          cat /tmp/shakedown-ai-review.txt