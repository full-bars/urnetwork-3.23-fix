name: Pre-Release Shakedown

# Runs the full v29+ pre-release shakedown on a disposable 1CPU/1GB DO droplet:
# fresh install -> auth -> Go tool -> proxies -> URL sources -> egress -> docker.
# The droplet is ALWAYS deleted, even on failure (trap + job timeout).
#
# Triggers: manual dispatch, or automatically when a v3.23.0-fix.* tag is pushed.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v3.23.0-fix.*'

permissions:
  contents: read

jobs:
  shakedown:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # hard cap: droplet cannot outlive the job (2h shakedown + margin)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Resolve target release version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag-triggered runs test THE RELEASE BEING CUT (GITHUB_REF_NAME),
          # not whatever :latest happens to be (MUST-FIX 10). Manual runs
          # default to the last published release.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/full-bars/urnetwork-3.23-fix/releases/latest" \
              2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo "")
            VER="${VER:-v3.23.0-fix.29.0}"
          fi
          # Poll until the tag's assets exist: the shakedown and the release
          # build fire on the same tag push, so assets may lag by minutes.
          for i in $(seq 1 30); do
            if curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/full-bars/urnetwork-3.23-fix/releases/tags/${VER}" \
              2>/dev/null | grep -q '"browser_download_url"'; then
              break
            fi
            echo "waiting for release assets of ${VER} (${i}/30)..."
            sleep 20
          done
          echo "EXPECTED_VERSION=${VER}" >> "$GITHUB_OUTPUT"
          echo "target release: ${VER}"

      - name: Mint disposable JWT from secrets
        id: mint
        env:
          GAUNTLET_USER: ${{ secrets.GAUNTLET_USER }}
          GAUNTLET_PW: ${{ secrets.GAUNTLET_PW }}
          DO_TOKEN: ${{ secrets.DIGITAL_OCEAN }}
        run: |
          # Build the provider binary and mint a fresh JWT for the shakedown
          # account. The credentials are injected by GitHub, never written
          # to files or echoed.
          go build -ldflags "-X main.Version=shakedown-mint" -o /tmp/provider ./provider/
          mkdir -p /tmp/mint
          HOME=/tmp/mint /tmp/provider auth \
            --user_auth="$GAUNTLET_USER" --password="$GAUNTLET_PW" \
            --api_url=https://api.bringyour.com -f 2>&1 | grep -vE '^I[0-9]{4}' || true
          test -s /tmp/mint/.urnetwork/jwt || { echo "JWT mint failed (verification required?)"; exit 1; }
          cp /tmp/mint/.urnetwork/jwt /tmp/gauntlet.jwt
          # Safety: refuse if it is the production account
          python3 - << 'PY'
          import base64, json
          raw = open('/tmp/gauntlet.jwt').read().strip()
          p = raw.split('.')[1] + '=' * (-len(raw.split('.')[1]) % 4)
          d = json.loads(base64.urlsafe_b64decode(p))
          print("account:", d.get('network_name'))
          if d.get('network_name') == 'mesocyclone':
              raise SystemExit("REFUSING: minted JWT is the production account")
          PY

      - name: Install DO API helper
        env:
          DO_TOKEN: ${{ secrets.DIGITAL_OCEAN }}
        run: |
          cat > /tmp/do.sh << 'SCRIPT'
          #!/bin/bash
          # Minimal DO helper: create 1CPU/1GB droplet, wait, run, delete.
          # Size is HARD-PINNED; anything else aborts and deletes.
          # SSH access uses an EPHEMERAL keypair minted in this job and
          # provisioned via the DO API at droplet creation — no static key.
          set -u
          SIZE_SLUG="s-1vcpu-1gb"; EXPECTED_VCPUS=1; EXPECTED_MEMORY_MB=1024
          REGION="${REGION:-nyc3}"
          API="https://api.digitalocean.com/v2"
          AUTH="Authorization: Bearer ${DO_TOKEN}"
          DROPLET_ID=""
          KEY_ID=""
          cleanup() {
            if [ -n "$DROPLET_ID" ]; then
              echo "CLEANUP: deleting droplet $DROPLET_ID"
              curl -s -X DELETE -H "$AUTH" "$API/droplets/$DROPLET_ID" -o /dev/null -w "delete HTTP %{http_code}\n"
            fi
            if [ -n "$KEY_ID" ]; then
              echo "CLEANUP: removing ephemeral SSH key $KEY_ID"
              curl -s -X DELETE -H "$AUTH" "$API/account/keys/$KEY_ID" -o /dev/null -w "key delete HTTP %{http_code}\n"
            fi
          }
          trap cleanup EXIT

          # --- Ephemeral SSH keypair for this run ---
          mkdir -p /tmp/sshkey && ssh-keygen -t ed25519 -f /tmp/sshkey/id_shakedown -N "" -C "shakedown-ci" >/dev/null 2>&1
          PUBKEY=$(cat /tmp/sshkey/id_shakedown.pub)
          KEYJSON=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"name\":\"shakedown-ci-$(date +%s)\",\"public_key\":\"$PUBKEY\"}" \
            "$API/account/keys")
          KEY_ID=$(echo "$KEYJSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('ssh_key',{}).get('id',''))" 2>/dev/null)
          FINGERPRINT=$(echo "$KEYJSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('ssh_key',{}).get('fingerprint',''))" 2>/dev/null)
          [ -n "$FINGERPRINT" ] || { echo "SSH key upload failed: $KEYJSON"; exit 1; }
          echo "ephemeral key ready (id=$KEY_ID fp=${FINGERPRINT:0:12}...)"

          echo "creating droplet (size=$SIZE_SLUG region=$REGION)"
          CREATE=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"name\":\"shakedown-$(date +%s)\",\"region\":\"$REGION\",\"size\":\"$SIZE_SLUG\",\"image\":\"ubuntu-24-04-x64\",\"ssh_keys\":[\"$FINGERPRINT\"],\"backups\":false,\"ipv6\":false,\"monitoring\":false}" \
            "$API/droplets")
          DROPLET_ID=$(echo "$CREATE" | python3 -c "import sys,json;print(json.load(sys.stdin).get('droplet',{}).get('id',''))" 2>/dev/null)
          [ -n "$DROPLET_ID" ] || { echo "create failed: $CREATE"; exit 1; }

          # Verify spec is exactly the cheap box
          sleep 5
          SPEC=$(curl -s -H "$AUTH" "$API/droplets/$DROPLET_ID")
          VCPUS=$(echo "$SPEC" | python3 -c "import sys,json;print(json.load(sys.stdin).get('droplet',{}).get('vcpus',''))" 2>/dev/null)
          MEM=$(echo "$SPEC" | python3 -c "import sys,json;print(json.load(sys.stdin).get('droplet',{}).get('memory',''))" 2>/dev/null)
          SIZE=$(echo "$SPEC" | python3 -c "import sys,json;print(json.load(sys.stdin).get('droplet',{}).get('size',{}).get('slug',''))" 2>/dev/null)
          echo "spec: vcpus=$VCPUS mem=${MEM}MB slug=$SIZE"
          if [ "$VCPUS" != "$EXPECTED_VCPUS" ] || [ "$MEM" != "$EXPECTED_MEMORY_MB" ] || [ "$SIZE" != "$SIZE_SLUG" ]; then
            echo "ERROR: droplet not the cheap spec — deleting and aborting"; exit 1
          fi

          SSHOPTS="-i /tmp/sshkey/id_shakedown -o ConnectTimeout=5 -o StrictHostKeyChecking=no"

          # Wait for SSH — require a PUBLIC IPv4 (private-only droplets cannot
          # be reached by the runner; caught here and deleted by cleanup).
          IP=""
          for i in $(seq 1 40); do
            SPEC2=$(curl -s -H "$AUTH" "$API/droplets/$DROPLET_ID")
            IP=$(echo "$SPEC2" | python3 -c "import sys,json;n=[x for x in json.load(sys.stdin).get('droplet',{}).get('networks',{}).get('v4',[]) if x.get('type')=='public'];print(n[0]['ip_address'] if n else '')" 2>/dev/null)
            if [ -n "$IP" ] && ssh $SSHOPTS root@$IP true 2>/dev/null; then
              echo "SSH up (public): $IP"; break
            fi
            sleep 10
          done
          [ -n "$IP" ] || { echo "ERROR: no public IPv4 / never reachable — aborting (cleanup deletes)"; exit 1; }

          # Ship JWT + shakedown, run under watchdog (MUST-FIX 18: propagate
          # the shakedown.s Tier-1 exit code so a RELEASE_BLOCKED fails the job)
          scp $SSHOPTS /tmp/gauntlet.jwt root@$IP:/tmp/gauntlet.jwt
          scp $SSHOPTS .github/scripts/shakedown.sh root@$IP:/tmp/shakedown.sh
          # EXPECTED_VERSION is written by the workflow's env expansion below.
          timeout 7200 ssh $SSHOPTS root@$IP "chmod +x /tmp/shakedown.sh && EXPECTED_VERSION='${EXPECTED_VERSION}' /tmp/shakedown.sh /tmp/gauntlet.jwt"
          GAUNT_RC=$?
          echo "shakedown exit code: $GAUNT_RC"
          # Collect report BEFORE trap deletes
          ssh $SSHOPTS root@$IP 'cat /tmp/shakedown-report.txt' > /tmp/shakedown-report.txt 2>/dev/null || true
          echo "REPORT_READY"
          exit $GAUNT_RC
          SCRIPT
          chmod +x /tmp/do.sh

      - name: Run shakedown
        env:
          DO_TOKEN: ${{ secrets.DIGITAL_OCEAN }}
          EXPECTED_VERSION: ${{ steps.version.outputs.EXPECTED_VERSION }}
        run: |
          /tmp/do.sh || true   # Tier-1 FAIL exits non-zero; report is collected inside
          echo "::group::Shakedown Report"
          cat /tmp/shakedown-report.txt 2>/dev/null || echo "(no report)"
          echo "::endgroup::"

      - name: AI review of shakedown report
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Classify each shakedown line: product bug vs environment blocker
          # vs test-script issue. Writes a summary to the artifact + step log.
          REPORT=$(cat /tmp/shakedown-report.txt 2>/dev/null || echo "no report")
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "AI review skipped (no GEMINI_API_KEY)"
            exit 0
          fi
          # Read the report OUTSIDE the heredoc — a $() inside the quoted
          # heredoc is sent literally to the API and fails (observed live).
          REPORT_TEXT=$(cat /tmp/shakedown-report.txt 2>/dev/null || echo "no report")
          python3 - "$REPORT_TEXT" << 'PAYLOAD' > /tmp/ai_review_payload.json
          import json, sys
          text = ("You are a release engineer triaging a pre-release shakedown report. "
                  "Classify EVERY FAIL line as one of: PRODUCT_BUG (likely a real bug in the provider/tools), "
                  "ENV_BLOCKER (network/account/dependency issue), or TEST_SCRIPT (bug in the shakedown script itself). "
                  "For each, say why in one sentence. Then give a one-line verdict: "
                  "RELEASE_BLOCKED if any PRODUCT_BUG, else RELEASE_OK. Be terse.\n\nReport:\n" + sys.argv[1])
          print(json.dumps({"contents": [{"parts": [{"text": text}]}]}))
          PAYLOAD
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" -d @/tmp/ai_review_payload.json \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['candidates'][0]['content']['parts'][0]['text'])" \
            > /tmp/shakedown-ai-review.txt 2>/dev/null || echo "AI review failed (API error)"
          echo "::group::AI Shakedown Review"
          cat /tmp/shakedown-ai-review.txt 2>/dev/null || echo "(no review)"
          echo "::endgroup::"

      - name: Post shakedown verdict to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.GAUNTLET_WEBHOOK }}
        run: |
          VERDICT=$(grep -oE "RELEASE_(BLOCKED|OK)" /tmp/shakedown-ai-review.txt 2>/dev/null | head -1)
          VERDICT="${VERDICT:-NO_REVIEW}"
          PASS=$(grep -c "^PASS:" /tmp/shakedown-report.txt 2>/dev/null || echo 0)
          FAIL=$(grep -c "^FAIL:" /tmp/shakedown-report.txt 2>/dev/null || echo 0)
          SUMMARY=$(grep -E "^(PASS|FAIL|SKIP):" /tmp/shakedown-report.txt 2>/dev/null | head -12 | tr '\n' '\n')
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord skip (no webhook)"
            exit 0
          fi
          python3 - "$DISCORD_WEBHOOK" << 'PY'
          import json, sys, urllib.request
          webhook = sys.argv[1]
          try:
              review = open('/tmp/shakedown-ai-review.txt').read().strip()
          except Exception:
              review = "(no review)"
          # Strip ANSI, keep terse
          lines = [l for l in review.splitlines() if l.strip()][:18]
          body = "**Pre-release shakedown run**\n" + "\n".join(lines[:14])
          payload = {"content": body[:1900]}
          req = urllib.request.Request(webhook, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=15)
              print("posted")
          except Exception as e:
              # A notification failure must never fail the shakedown run.
              print("discord post failed (non-fatal):", e)
          PY

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shakedown-report
          path: |
            /tmp/shakedown-report.txt
            /tmp/shakedown-ai-review.txt
          if-no-files-found: ignore
