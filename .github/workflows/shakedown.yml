name: Pre-Release Shakedown

# Runs the full v29+ pre-release shakedown on a disposable 1CPU/1GB DO droplet:
# fresh install -> auth -> Go tool -> proxies -> URL sources -> egress -> docker.
# The droplet is ALWAYS deleted, even on failure (trap + job timeout).
#
# Triggers: manual dispatch, or automatically when a v3.23.0-fix.* tag is pushed.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v3.23.0-fix.*'

permissions:
  contents: read
  actions: read

jobs:
  shakedown:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # hard cap: droplet cannot outlive the job (2h shakedown + margin)
    # Two runs share the same gauntlet account server-side (two providers on
    # one account cross-contaminate admission state). Queue, never cancel: a
    # cancel-in-progress:true would kill a 2h run AND orphan its droplet.
    concurrency:
      group: shakedown
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Resolve target release version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag-triggered runs test THE RELEASE BEING CUT (GITHUB_REF_NAME),
          # not whatever :latest happens to be (MUST-FIX 10). Manual runs
          # default to the last published release.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/full-bars/urnetwork-3.23-fix/releases/latest" \
              2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo "")
            VER="${VER:-v3.23.0-fix.29.0}"
          fi
          # Wait for the release build to COMPLETE, not a fixed timer. The
          # shakedown and release.yml fire on the same tag push. The build
          # itself is ~1-2 min (6-platform matrix); the VirusTotal scan is the
          # variable cost (measured 24 min on v29.1). So: poll the release
          # workflow run's conclusion via the Actions API. Fail FAST the
          # moment the release run fails (no 30-min blind wait). Proceed the
          # moment assets exist. Hard cap 60 min as a safety net only.
          # (User directive 2026-08-15: no hardcoded timers; adapt.)
          GITHUB_SHA_SHORT="${GITHUB_SHA}"
          ASSETS_OK=0
          RELEASE_FAILED=0
          for i in $(seq 1 120); do
            # 1. Did the release workflow finish? Query runs for this SHA.
            #    (workflow_run data is in the Actions API, token-scoped.)
            REL_CONC=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/full-bars/urnetwork-3.23-fix/actions/runs?event=push&head_sha=${GITHUB_SHA_SHORT}&per_page=20" \
              2>/dev/null | python3 -c "import sys,json;print(next((r.get('status','')+'/'+str(r.get('conclusion','')) for r in json.load(sys.stdin).get('workflow_runs',[]) if r.get('path')=='.github/workflows/release.yml'),''))" 2>/dev/null)
            # 2. Fail fast: the CREATE-RELEASE job completed with a bad
            # conclusion. Query the run's jobs: the run-level conclusion
            # includes the scan job, which is deliberately non-blocking and
            # can be red without affecting the release.
            REL_RUN_ID=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/full-bars/urnetwork-3.23-fix/actions/runs?event=push&head_sha=${GITHUB_SHA_SHORT}&per_page=20" \
              2>/dev/null | python3 -c "import sys,json;print(next((r.get('id','') for r in json.load(sys.stdin).get('workflow_runs',[]) if r.get('path')=='.github/workflows/release.yml'),''))" 2>/dev/null)
            if [ -n "$REL_RUN_ID" ]; then
              REL_JOB_CONC=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                "https://api.github.com/repos/full-bars/urnetwork-3.23-fix/actions/runs/${REL_RUN_ID}/jobs?per_page=50" \
                2>/dev/null | python3 -c "import sys,json;print(next((j.get('conclusion','') for j in json.load(sys.stdin).get('jobs',[]) if j.get('name')=='Create Release'),''))" 2>/dev/null)
              if echo "$REL_JOB_CONC" | grep -qE "failure|cancelled|timed_out|action_required"; then
                echo "::error::create-release job FAILED ($REL_JOB_CONC) — shakedown aborted as ENV_BLOCKER"
                RELEASE_FAILED=1
                break
              fi
            fi
            # 3. Assets exist? The release is published; start the test.
            if curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/full-bars/urnetwork-3.23-fix/releases/tags/${VER}" \
              2>/dev/null | grep -q '"browser_download_url"'; then
              ASSETS_OK=1
              echo "release assets for ${VER} appeared (iteration $i)"
              break
            fi
            echo "waiting for release build of ${VER} (${i}/120)..."
            sleep 30
          done
          if [ "$RELEASE_FAILED" = "1" ]; then
            # The release pipeline failed, not the product. ENV_BLOCKER.
            echo "ENV_BLOCKER=1" >> "$GITHUB_OUTPUT"
            echo 75 > /tmp/shakedown.exit
            exit 75
          fi
          if [ "$ASSETS_OK" != "1" ] && [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Safety-net cap hit: 60 min with no assets and no failed run.
            echo "::error::release assets for ${VER} never appeared within 60 min safety cap"
            echo "::error::shakedown aborted as ENV_BLOCKER; the release pipeline, not the product, is suspect"
            echo "ENV_BLOCKER=1" >> "$GITHUB_OUTPUT"
            echo 75 > /tmp/shakedown.exit
            exit 75
          fi
          echo "EXPECTED_VERSION=${VER}" >> "$GITHUB_OUTPUT"
          echo "target release: ${VER}"

      - name: Mint disposable JWT from secrets
        id: mint
        env:
          GAUNTLET_USER: ${{ secrets.GAUNTLET_USER }}
          GAUNTLET_PW: ${{ secrets.GAUNTLET_PW }}
          DO_TOKEN: ${{ secrets.DIGITAL_OCEAN }}
        run: |
          # Build the provider binary and mint a fresh JWT for the shakedown
          # account. The credentials are injected by GitHub, never written
          # to files or echoed.
          go build -ldflags "-X main.Version=shakedown-mint" -o /tmp/provider ./provider/
          mkdir -p /tmp/mint
          HOME=/tmp/mint /tmp/provider auth \
            --user_auth="$GAUNTLET_USER" --password="$GAUNTLET_PW" \
            --api_url=https://api.bringyour.com -f 2>&1 | grep -vE '^I[0-9]{4}' || true
          test -s /tmp/mint/.urnetwork/jwt || { echo "JWT mint failed (verification required?)"; exit 1; }
          cp /tmp/mint/.urnetwork/jwt /tmp/gauntlet.jwt
          # Safety: refuse if it is the production account
          python3 - << 'PY'
          import base64, json
          raw = open('/tmp/gauntlet.jwt').read().strip()
          p = raw.split('.')[1] + '=' * (-len(raw.split('.')[1]) % 4)
          d = json.loads(base64.urlsafe_b64decode(p))
          print("account:", d.get('network_name'))
          if d.get('network_name') == 'mesocyclone':
              raise SystemExit("REFUSING: minted JWT is the production account")
          PY

      - name: Syntax-check shakedown script
        # Opus R5 NICE: catch a broken shakedown.sh BEFORE any droplet is
        # created. The in-do.sh bash -n (line 242) runs after droplet boot;
        # this one costs nothing.
        run: |
          bash -n .github/scripts/shakedown.sh || { echo "::error::shakedown.sh syntax error — aborting before droplet creation"; exit 1; }
          python3 -c "import ast; ast.parse(open('.github/scripts/shakedown-sweep.py').read())" || { echo "::error::shakedown-sweep.py syntax error"; exit 1; }

      - name: Install DO API helper
        env:
          DO_TOKEN: ${{ secrets.DIGITAL_OCEAN }}
        run: |
          cat > /tmp/do.sh << 'SCRIPT'
          #!/bin/bash
          # Minimal DO helper: create 1CPU/1GB droplet, wait, run, delete.
          # Size is HARD-PINNED; anything else aborts and deletes.
          # SSH access uses an EPHEMERAL keypair minted in this job and
          # provisioned via the DO API at droplet creation. No static key.
          set -u
          SIZE_SLUG="s-1vcpu-1gb"; EXPECTED_VCPUS=1; EXPECTED_MEMORY_MB=1024
          REGION="${REGION:-nyc3}"
          API="https://api.digitalocean.com/v2"
          AUTH="Authorization: Bearer ${DO_TOKEN}"
          DROPLET_ID=""
          KEY_ID=""
          RUN_TAG="shakedown-${GITHUB_RUN_ID}"
          # Delete by tag when no ID is known (death between create and parse).
          # Retry 5x with backoff and VERIFY the list is empty (a silent 429/5xx
          # would otherwise leak a droplet forever).
          do_delete_by_tag() {
            local tag="$1"
            for attempt in 1 2 3 4 5; do
              local code
              code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "$AUTH" "$API/droplets?tag_name=$tag")
              echo "CLEANUP: delete-by-tag $tag attempt $attempt HTTP $code"
              [ "$code" = "204" ] || [ "$code" = "200" ] && break
              sleep $((attempt * 10))
            done
            local remaining
            # DO deletes asynchronously: verify immediately can false-error on a
            # still-listed droplet. Sleep + recheck once (Fable5 N-17).
            sleep 5
            remaining=$(curl -s -H "$AUTH" "$API/droplets?tag_name=$tag" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('droplets',[])))" 2>/dev/null || echo "?")
            if [ "$remaining" != "0" ]; then
              echo "::error::CLEANUP FAILED: $remaining droplet(s) still tagged $tag"
            else
              echo "CLEANUP: verified 0 droplets remain tagged $tag"
            fi
          }
          do_delete_by_id() {
            local id="$1"
            for attempt in 1 2 3 4 5; do
              local code
              code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "$AUTH" "$API/droplets/$id")
              echo "CLEANUP: delete droplet $id attempt $attempt HTTP $code"
              # 404 = already gone (sweeper/delete-by-tag won the race) — success
              # (Fable5 N-16: retrying 404 five times burned ~150s of trap time).
              [ "$code" = "204" ] || [ "$code" = "200" ] || [ "$code" = "404" ] && break
              sleep $((attempt * 10))
            done
          }
          cleanup() {
            if [ -n "$DROPLET_ID" ]; then
              do_delete_by_id "$DROPLET_ID"
            fi
            # Tag-based sweep covers the unknown-ID and runner-death windows.
            do_delete_by_tag "$RUN_TAG"
            if [ -n "$KEY_ID" ]; then
              echo "CLEANUP: removing ephemeral SSH key $KEY_ID"
              curl -s -X DELETE -H "$AUTH" "$API/account/keys/$KEY_ID" -o /dev/null -w "key delete HTTP %{http_code}\n"
            fi
          }
          # EXIT-only misses SIGTERM/SIGINT (job timeout, cancel). Trap them
          # all, and EXIT on signal (a trap that runs cleanup then resumes
          # would keep polling a deleted droplet — DeepSeek SF 6).
          trap 'cleanup; exit 143' TERM INT HUP
          trap cleanup EXIT

          # --- Ephemeral SSH keypair for this run ---
          mkdir -p /tmp/sshkey && ssh-keygen -t ed25519 -f /tmp/sshkey/id_shakedown -N "" -C "shakedown-ci" >/dev/null 2>&1
          PUBKEY=$(cat /tmp/sshkey/id_shakedown.pub)
          KEYJSON=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"name\":\"shakedown-ci-$(date +%s)\",\"public_key\":\"$PUBKEY\"}" \
            "$API/account/keys")
          KEY_ID=$(echo "$KEYJSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('ssh_key',{}).get('id',''))" 2>/dev/null)
          FINGERPRINT=$(echo "$KEYJSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('ssh_key',{}).get('fingerprint',''))" 2>/dev/null)
          [ -n "$FINGERPRINT" ] || { echo "SSH key upload failed: $KEYJSON"; exit 1; }
          echo "ephemeral key ready (id=$KEY_ID fp=${FINGERPRINT:0:12}...)"

          echo "creating droplet (size=$SIZE_SLUG region=$REGION tag=$RUN_TAG)"
          CREATE=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"name\":\"$RUN_TAG\",\"region\":\"$REGION\",\"size\":\"$SIZE_SLUG\",\"image\":\"ubuntu-24-04-x64\",\"ssh_keys\":[\"$FINGERPRINT\"],\"backups\":false,\"ipv6\":false,\"monitoring\":false,\"tags\":[\"shakedown-ci\",\"$RUN_TAG\"]}" \
            "$API/droplets")
          DROPLET_ID=$(echo "$CREATE" | python3 -c "import sys,json;print(json.load(sys.stdin).get('droplet',{}).get('id',''))" 2>/dev/null)
          [ -n "$DROPLET_ID" ] || { echo "create failed: $CREATE"; exit 1; }

          # Verify spec is exactly the cheap box
          sleep 5
          SPEC=$(curl -s -H "$AUTH" "$API/droplets/$DROPLET_ID")
          VCPUS=$(echo "$SPEC" | python3 -c "import sys,json;print(json.load(sys.stdin).get('droplet',{}).get('vcpus',''))" 2>/dev/null)
          MEM=$(echo "$SPEC" | python3 -c "import sys,json;print(json.load(sys.stdin).get('droplet',{}).get('memory',''))" 2>/dev/null)
          SIZE=$(echo "$SPEC" | python3 -c "import sys,json;print(json.load(sys.stdin).get('droplet',{}).get('size',{}).get('slug',''))" 2>/dev/null)
          echo "spec: vcpus=$VCPUS mem=${MEM}MB slug=$SIZE"
          if [ "$VCPUS" != "$EXPECTED_VCPUS" ] || [ "$MEM" != "$EXPECTED_MEMORY_MB" ] || [ "$SIZE" != "$SIZE_SLUG" ]; then
            echo "ERROR: droplet not the cheap spec. Deleting and aborting"; exit 1
          fi

          SSHOPTS="-i /tmp/sshkey/id_shakedown -o ConnectTimeout=5 -o StrictHostKeyChecking=no"

          # Wait for SSH. Require a PUBLIC IPv4 (private-only droplets cannot
          # be reached by the runner; caught here and deleted by cleanup).
          IP=""
          for i in $(seq 1 40); do
            SPEC2=$(curl -s -H "$AUTH" "$API/droplets/$DROPLET_ID")
            IP=$(echo "$SPEC2" | python3 -c "import sys,json;n=[x for x in json.load(sys.stdin).get('droplet',{}).get('networks',{}).get('v4',[]) if x.get('type')=='public'];print(n[0]['ip_address'] if n else '')" 2>/dev/null)
            if [ -n "$IP" ] && ssh $SSHOPTS root@$IP true 2>/dev/null; then
              echo "SSH up (public): $IP"; break
            fi
            sleep 10
          done
          [ -n "$IP" ] || { echo "ERROR: no public IPv4 / never reachable. Aborting (cleanup deletes)"; exit 1; }

          # Ship JWT + shakedown. Run the test DETACHED via systemd-run so the
          # ssh session returns immediately. Backgrounded children (systemd
          # user session, docker) previously held the ssh pipe open after the
          # script exited, so ssh never returned and the watchdog had to kill
          # it (real run: 76 min of work, 54 min of dead idle time, exit 124).
          # systemd-run is chosen over tmux: it is already on the box (no apt
          # race), preserves the exit code via ExecMainStatus, and logs to
          # journald. The script writes its own RESULT sentinel as the LAST
          # action via atomic rename, so the poller never sees a partial one.
          scp $SSHOPTS /tmp/gauntlet.jwt root@$IP:/tmp/gauntlet.jwt
          [ $? -eq 0 ] || { echo "::error::scp jwt failed"; exit 1; }
          scp $SSHOPTS .github/scripts/shakedown.sh root@$IP:/tmp/shakedown.sh
          [ $? -eq 0 ] || { echo "::error::scp shakedown.sh failed"; exit 1; }
          # bash -n the script on the runner BEFORE it boots a droplet run.
          bash -n .github/scripts/shakedown.sh || { echo "::error::shakedown.sh syntax error"; exit 1; }
          # Launch detached. --setenv propagates EXPECTED_VERSION (fails loud if
          # unset) and DEADLINE_EPOCH (lets Phase 2 shrink itself under the job
          # cap — Opus MUST-FIX 5). The wrapper writes the script exit code to
          # the rc sentinel via atomic rename (Sonnet finding #1: single \ so
          # $? reaches the REMOTE shell, not the runner's).
          # 5400s (90 min) poll budget + 900s poll-overrun margin. Pre-launch
          # is now ~22-27 min (checkout + Go + build + 15-min asset poll +
          # droplet/SSH wait), so 27 + 90 + 15 = ~132 min < the 150-min job
          # cap, with real margin for collection + AI + artifact (Opus R5 MF-4).
          DEADLINE_EPOCH=$(( $(date +%s) + 5400 ))
          # --no-block is REQUIRED: with Type=oneshot, systemd-run waits for the
          # start job to complete (= the whole script) unless told not to, which
          # would block ssh and recreate the original held-open bug (DS R3 M2).
          ssh $SSHOPTS root@$IP "systemd-run --no-block --unit=shakedown --property=Type=oneshot --property=RemainAfterExit=yes --setenv=EXPECTED_VERSION='${EXPECTED_VERSION}' --setenv=DEADLINE_EPOCH='${DEADLINE_EPOCH}' /bin/bash -c 'bash /tmp/shakedown.sh /tmp/gauntlet.jwt > /tmp/shakedown.out 2>&1; rc=\$?; sync; echo \$rc > /tmp/shakedown.rc.part; mv /tmp/shakedown.rc.part /tmp/shakedown.rc'" \
            && echo "shakedown launched via systemd-run (ssh returned immediately)" \
            || { echo "::error::systemd-run launch failed — aborting (cleanup deletes)"; exit 1; }
          # Poll for the rc SENTINEL (atomic mv), never the report file (it
          # exists from the script's first line). Bounded ssh per poll so one
          # stuck handshake cannot stall the loop. Poll deadline computed
          # against the job cap with a teardown reserve (MUST-FIX 5).
          SSHOPTS_B="$SSHOPTS -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          POLL_DEADLINE=$(( DEADLINE_EPOCH + 900 ))   # 15 min past the script's deadline: the Phase-2 loop's final sleep 300 can overshoot P2_END by a sample (Opus R5 MF-4)
          SHAKE_RC=""
          CONSECUTIVE_FAIL=0
          STALE_HB=0
          while [ "$(date +%s)" -lt "$POLL_DEADLINE" ]; do
            # Emit a POSITIVE signal on every successful ssh: RC_EOF when the
            # sentinel exists, STILL_RUNNING when it does not (true for most of
            # the run). Empty OUT therefore means ssh itself failed, which is
            # the only thing that increments CONSECUTIVE_FAIL (Sonnet MF 2).
            OUT=$(timeout 30 ssh $SSHOPTS_B root@$IP "if test -f /tmp/shakedown.rc; then cat /tmp/shakedown.rc; echo RC_EOF; else echo STILL_RUNNING; fi" 2>/dev/null)
            if echo "$OUT" | grep -q "RC_EOF"; then
              SHAKE_RC=$(echo "$OUT" | grep -v RC_EOF | grep -v STILL_RUNNING | head -1)
              echo "shakedown sentinel rc: $SHAKE_RC"
              break
            fi
            # Distinguish transport failure from sentinel-not-yet-written: a
            # successful ssh emits STILL_RUNNING (normal, reset the counter).
            # Empty OUT = ssh failed.
            if [ -n "$OUT" ]; then
              CONSECUTIVE_FAIL=0
              # STALLED detection (DS R3 S3): the script touches the heartbeat
              # on every Phase-2 sample; a unit 'alive' but heartbeat >15 min
              # old means the script is wedged (not crashed). Compute age
              # DROPLET-side so runner/droplet clock skew cannot shift the
              # threshold (Fable5 N-13). Escalate after 3 consecutive stale
              # readings (45 min wedged) — a hung script must not burn the
              # whole poll budget (DeepSeek R5 SF-6).
              HB_AGE=$(timeout 20 ssh $SSHOPTS_B root@$IP "NOW=\$(date +%s); HB=\$(stat -c %Y /tmp/shakedown.heartbeat 2>/dev/null || echo 0); [ \"\$HB\" -gt 0 ] && echo \$(( NOW - HB ))" 2>/dev/null)
              if [ -n "$HB_AGE" ] && [ "$HB_AGE" -gt 900 ]; then
                STALE_HB=$((STALE_HB + 1))
                echo "::warning::STALLED: heartbeat $HB_AGE s old (>15 min) — strike $STALE_HB/3"
                if [ "$STALE_HB" -ge 3 ]; then
                  echo "::error::HARNESS_STALLED: heartbeat stale for 3 consecutive polls — script wedged"
                  SHAKE_RC=124
                  break
                fi
              else
                STALE_HB=0
              fi
            else
              CONSECUTIVE_FAIL=$((CONSECUTIVE_FAIL + 1))
            fi
            if [ "$CONSECUTIVE_FAIL" -ge 5 ]; then
              echo "WARN: 5 consecutive ssh failures — droplet may be lost"
              # Confirm via the DO API (reachable even when ssh is not) instead
              # of riding the same broken transport (Fable5 SF-6): an empty
              # systemctl response was being treated as "unit gone" when it
              # just meant "ssh broken".
              DO_STATE=$(curl -s -H "$AUTH" "$API/droplets/$DROPLET_ID" 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('droplet',{}).get('status',''))" 2>/dev/null)
              if [ "$DO_STATE" != "active" ]; then
                echo "::error::HARNESS_CRASH: DO droplet not active ($DO_STATE) after 5 ssh failures"
                SHAKE_RC=124
                break
              else
                echo "INFO: DO droplet still active — ssh flake, not a crash; continuing"
                CONSECUTIVE_FAIL=0
              fi
            fi
            # Stream the report on every poll so droplet death never costs
            # the whole artifact. Append to a STAGING file first: a direct
            # truncating redirect would wipe prior polls if ssh fails here
            # (CodeRabbit major: report redirect destroys streamed output).
            timeout 30 ssh $SSHOPTS_B root@$IP 'cat /tmp/shakedown-report.txt' > /tmp/shakedown-report.poll 2>/dev/null
            if [ -s /tmp/shakedown-report.poll ]; then
              mv /tmp/shakedown-report.poll /tmp/shakedown-report.txt
            fi
            sleep 60
          done
          if [ -z "$SHAKE_RC" ]; then
            echo "::error::WATCHDOG_TIMEOUT: shakedown did not finish within poll deadline"
            SHAKE_RC=124
          fi
          echo "shakedown exit code: $SHAKE_RC"
          # Collect the final report BEFORE trap deletes. Stage then mv so a
          # failed ssh (droplet lost) cannot truncate the streamed report —
          # the same bug the poll loop guards against (Sonnet MUST-FIX 1).
          timeout 30 ssh $SSHOPTS root@$IP 'cat /tmp/shakedown-report.txt' > /tmp/shakedown-report.final 2>/dev/null
          if [ -s /tmp/shakedown-report.final ]; then
            mv /tmp/shakedown-report.final /tmp/shakedown-report.txt
          fi
          # N-14 (Fable5): shakedown.out duplicates every tee'd line already in
          # the report, doubling PASS/FAIL counts in Discord/summary. Append
          # only lines NOT already present (tail of stderr diagnostics that
          # never hit the report).
          timeout 30 ssh $SSHOPTS root@$IP 'if [ -s /tmp/shakedown-report.txt ]; then grep -vxFf /tmp/shakedown-report.txt /tmp/shakedown.out 2>/dev/null | tail -50; fi' >> /tmp/shakedown-report.txt 2>/dev/null || true
          echo "REPORT_READY"
          exit $SHAKE_RC
          SCRIPT
          chmod +x /tmp/do.sh

      - name: Run shakedown
        env:
          DO_TOKEN: ${{ secrets.DIGITAL_OCEAN }}
          EXPECTED_VERSION: ${{ steps.version.outputs.EXPECTED_VERSION }}
        run: |
          # Deterministic gate: do.sh exits with the shakedown's real status.
          # No || true — a Tier-1 FAIL or HARNESS_CRASH must fail this job.
          set +e
          /tmp/do.sh
          SHAKE_EXIT=$?
          set -e
          echo "::group::Shakedown Report"
          cat /tmp/shakedown-report.txt 2>/dev/null || echo "(no report)"
          echo "::endgroup::"
          echo "do.sh exit: $SHAKE_EXIT"
          # Persist for the AI-review step: a nonzero non-75 exit means the
          # run did not complete cleanly — the deterministic verdict must be
          # RELEASE_BLOCKED even if the report has no FAIL: line yet (Sonnet
          # finding #5: crash/timeout before any bad() call = false green).
          # NOTE: written AFTER the FAIL->1 promotion below so the persisted
          # value matches the job's actual status (DeepSeek R5 MF-3: writing
          # 0 before promotion left a false-green RELEASE_OK in the verdict).
          # DeepSeek R5 MF-4: a non-Tier-1 bad() FAIL (e.g. multi-provider
          # ambiguity, hot-restart identity) exits the SCRIPT 0 but is still a
          # product FAIL. The job must not go green on those either.
          REPORT_FAILS=$(grep -c "^FAIL:" /tmp/shakedown-report.txt 2>/dev/null || true)
          if [ "$SHAKE_EXIT" = "0" ] && [ "${REPORT_FAILS:-0}" -gt 0 ]; then
            echo "::error::shakedown reported $REPORT_FAILS FAIL(s) but exited 0 — treating as RELEASE_BLOCKED"
            SHAKE_EXIT=1
          fi
          # Persist AFTER the promotion so the AI verdict agrees with the job.
          echo "$SHAKE_EXIT" > /tmp/shakedown.exit
          # Map the exit to the verdict table (Opus MUST-FIX 8):
          # 0 = PASS, 1 = RELEASE_BLOCKED (Tier-1), 75 = ENV_BLOCKER,
          # 124 = WATCHDOG_TIMEOUT/HARNESS_CRASH (already ::error::'d in do.sh).
          if [ "$SHAKE_EXIT" -eq 75 ]; then
            # SF-9 (Fable5): an untested release must not show the same green
            # check as a tested PASS. Surface it loudly as NOT TESTED.
            echo "::error::ENV_BLOCKER (rc=75) — shakedown did NOT run the release. This is NOT a pass."
            echo "::error::Any release gated on this job must be treated as UNTESTED until a clean run."
            exit 75
          fi
          exit $SHAKE_EXIT

      - name: AI review of shakedown report
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Classify each shakedown line: product bug vs environment blocker
          # vs test-script issue. The DETERMINISTIC verdict is computed from
          # the report itself (MUST-FIX 8); Gemini is annotation only and can
          # never be the gate. On API failure write a NON-EMPTY fallback so
          # the artifact + Discord still carry the signal.
          REPORT_TEXT=$(cat /tmp/shakedown-report.txt 2>/dev/null || echo "no report")
          # Deterministic classification: parse the report for the verdict.
          # A nonzero non-75 shakedown exit (crash/timeout before any FAIL:)
          # overrides the report grep — never false-green (Sonnet #5).
          # Exit 75 (ENV_BLOCKER) short-circuits BEFORE the report grep, so a
          # NON_STARTER run (which writes bad() lines then exits 75) is never
          # graded RELEASE_BLOCKED (DS R3 S1).
          SHAKE_EXIT=$(cat /tmp/shakedown.exit 2>/dev/null || echo "MISSING")
          # MISSING means the Run step was SIGKILLed before writing the exit
          # code (job timeout / runner death) — a partial run, not a PASS
          # (Fable5 MF-3: defaulting to 0 gave a false RELEASE_OK).
          if [ "$SHAKE_EXIT" = "MISSING" ] || ! [ "$SHAKE_EXIT" -eq "$SHAKE_EXIT" ] 2>/dev/null; then
            echo "::warning::shakedown.exit missing or non-numeric ('$SHAKE_EXIT') — treating as incomplete run"
            SHAKE_EXIT=124
          fi
          if [ "$SHAKE_EXIT" = "75" ]; then
            DET_VERDICT="ENV_BLOCKER"
          # Key off TIER1_FAIL and the exit code, NOT raw SELF-TEST-FAIL text:
          # a self-test calibration miss must not force RELEASE_BLOCKED (the
          # [jwt] pattern is permanently missing on real runs; the script's
          # binding-calibration design forbids a rotted regex from blocking).
          elif echo "$REPORT_TEXT" | grep -q "TIER1_FAIL=1"; then
            DET_VERDICT="RELEASE_BLOCKED"
          elif [ -n "$SHAKE_EXIT" ] && [ "$SHAKE_EXIT" != "0" ]; then
            DET_VERDICT="RELEASE_BLOCKED"
          else
            DET_VERDICT="RELEASE_OK"
          fi
          # Write the deterministic header FIRST. AI_REVIEW_STATUS is written
          # exactly once AFTER the request resolves (CodeRabbit: duplicate
          # OK/FAILED with conflicting values).
          echo "DETERMINISTIC_VERDICT=$DET_VERDICT" > /tmp/shakedown-ai-review.txt
          # The forced-by note must come AFTER the > write above, or it is
          # truncated (DS R3 NICE: annotation always lost).
          if [ "$DET_VERDICT" = "RELEASE_BLOCKED" ] && [ "$SHAKE_EXIT" != "0" ] && [ "$SHAKE_EXIT" != "75" ]; then
            echo "  (forced by shakedown exit $SHAKE_EXIT — run did not complete cleanly)" >> /tmp/shakedown-ai-review.txt
          fi
          echo "PASS=$(echo "$REPORT_TEXT" | grep -c '^PASS:' || true)"
          echo "FAIL=$(echo "$REPORT_TEXT" | grep -c '^FAIL:' || true)"
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "AI_REVIEW_STATUS=SKIPPED" >> /tmp/shakedown-ai-review.txt
            echo "AI review skipped (no GEMINI_API_KEY); deterministic verdict: $DET_VERDICT" >> /tmp/shakedown-ai-review.txt
            echo "::warning::Gemini unavailable; using deterministic verdict $DET_VERDICT"
            echo "::group::AI Shakedown Review"
            cat /tmp/shakedown-ai-review.txt
            echo "::endgroup::"
            exit 0
          fi
          # Read the report OUTSIDE the heredoc. A $() inside the quoted
          # heredoc is sent literally to the API and fails (observed live).
          python3 - "$REPORT_TEXT" << 'PAYLOAD' > /tmp/ai_review_payload.json
          import json, sys
          text = ("You are a release engineer triaging a pre-release shakedown report. "
                  "Classify EVERY FAIL line as one of: PRODUCT_BUG (likely a real bug in the provider/tools), "
                  "ENV_BLOCKER (network/account/dependency issue), or TEST_SCRIPT (bug in the shakedown script itself). "
                  "For each, say why in one sentence. Then give a one-line verdict: "
                  "RELEASE_BLOCKED if any PRODUCT_BUG, else RELEASE_OK. Be terse.\n\nReport:\n" + sys.argv[1])
          print(json.dumps({"contents": [{"parts": [{"text": text}]}]}))
          PAYLOAD
          # -f fails on non-2xx; save the HTTP status so a schema change or
          # quota exhaustion is distinguishable from a transient failure.
          HTTP_CODE=$(curl -sS -o /tmp/gemini_response.json -w "%{http_code}" \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" -d @/tmp/ai_review_payload.json) || HTTP_CODE=000
          echo "gemini HTTP $HTTP_CODE" >> /tmp/shakedown-ai-review.txt
          if [ "$HTTP_CODE" = "200" ]; then
            python3 -c "import sys,json;d=json.load(open('/tmp/gemini_response.json'));print(d['candidates'][0]['content']['parts'][0]['text'])" \
              >> /tmp/shakedown-ai-review.txt 2>/dev/null || echo "AI review parse failed" >> /tmp/shakedown-ai-review.txt
            echo "AI_REVIEW_STATUS=OK" >> /tmp/shakedown-ai-review.txt
          else
            echo "AI_REVIEW_STATUS=FAILED" >> /tmp/shakedown-ai-review.txt
            # Non-empty fallback: the deterministic verdict + raw FAIL lines.
            echo "" >> /tmp/shakedown-ai-review.txt
            echo "AI UNAVAILABLE (HTTP $HTTP_CODE) — deterministic verdict follows:" >> /tmp/shakedown-ai-review.txt
            echo "$DET_VERDICT" >> /tmp/shakedown-ai-review.txt
            echo "--- raw FAIL lines ---" >> /tmp/shakedown-ai-review.txt
            echo "$REPORT_TEXT" | grep -E "^(FAIL|SELF-TEST-FAIL|WARN):" >> /tmp/shakedown-ai-review.txt || true
            echo "::warning::Gemini failed (HTTP $HTTP_CODE); using deterministic verdict"
          fi
          echo "::group::AI Shakedown Review"
          cat /tmp/shakedown-ai-review.txt
          echo "::endgroup::"

      - name: Post shakedown verdict to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.GAUNTLET_WEBHOOK }}
        run: |
          VERDICT=$(grep -oE "DETERMINISTIC_VERDICT=(RELEASE_BLOCKED|RELEASE_OK|ENV_BLOCKER)" /tmp/shakedown-ai-review.txt 2>/dev/null | head -1 | cut -d= -f2)
          VERDICT="${VERDICT:-NO_REVIEW}"
          # grep -c emits "0" AND exits 1 when there are no matches; || true.
          PASS=$(grep -c "^PASS:" /tmp/shakedown-report.txt 2>/dev/null || true)
          FAIL=$(grep -c "^FAIL:" /tmp/shakedown-report.txt 2>/dev/null || true)
          # The verdict must be visible even when Discord 403s. GITHUB_STEP_SUMMARY
          # cannot fail the same way (Opus SHOULD-FIX 16).
          {
            echo "## Shakedown verdict: $VERDICT"
            echo ""
            echo "PASS=$PASS FAIL=$FAIL"
            echo ""
            echo '```'
            grep -E "^(PASS|FAIL|SKIP|WARN):" /tmp/shakedown-report.txt 2>/dev/null | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord skip (no webhook)"
            exit 0
          fi
          # Webhook via env, never argv (visible in ps).
          python3 << 'PY'
          import json, os, urllib.request
          webhook = os.environ.get("DISCORD_WEBHOOK", "")
          try:
              review = open('/tmp/shakedown-ai-review.txt').read().strip()
          except Exception:
              review = "(no review)"
          lines = [l for l in review.splitlines() if l.strip()][:18]
          body = "**Pre-release shakedown run**\n" + "\n".join(lines[:14])
          payload = {"content": body[:1900]}
          req = urllib.request.Request(webhook, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"})
          try:
              resp = urllib.request.urlopen(req, timeout=15)
              if resp.status >= 300:
                  print(f"::warning::discord post HTTP {resp.status} (non-fatal)")
              else:
                  print("posted")
          except Exception as e:
              # A notification failure must never fail the shakedown run.
              print("::warning::discord post failed (non-fatal):", e)
          PY

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shakedown-report
          path: |
            /tmp/shakedown-report.txt
            /tmp/shakedown-ai-review.txt
          if-no-files-found: ignore
