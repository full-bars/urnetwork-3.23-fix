name: Test Discord Webhook

on:
  push:
    branches:
      - feat/release-discord-notifications

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          BUILD_NOTIFY: ${{ secrets.BUILD_NOTIFY }}
        run: |
          if [ -z "$BUILD_NOTIFY" ]; then
            echo "BUILD_NOTIFY secret is not set"
            exit 1
          fi
          curl -sf -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "🧪 Test message",
              "description": "This is a one-off test from the test-discord-webhook workflow, confirming the BUILD_NOTIFY secret delivers to this channel. Safe to ignore.",
              "color": 10181046,
              "footer": { "text": "URNetwork CI • Webhook test" }
            }]
          }' "$BUILD_NOTIFY"
