name: Test Discord Webhook

on:
  push:
    branches:
      - feat/release-discord-notifications

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set"
            exit 1
          fi
          curl -sf -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "🧪 Test message",
              "description": "This is a one-off test from the test-discord-webhook workflow, confirming the DISCORD_WEBHOOK secret delivers to this channel. Safe to ignore.",
              "color": 10181046,
              "footer": { "text": "URNetwork CI • Webhook test" }
            }]
          }' "$DISCORD_WEBHOOK"
