name: Shakedown Droplet Sweeper

# Out-of-band orphan guarantee. The shakedown workflow deletes its own
# droplet on every normal path, but a runner eviction, job-timeout SIGKILL,
# or DO API failure can orphan a droplet with no one to delete it. DigitalOcean
# has no built-in auto-expire. This sweeper is the backstop: it lists all
# droplets tagged shakedown-ci and destroys any older than the cutoff.
#
# SEPARATE FILE on purpose: a broken shakedown.yml must not take the sweeper
# down with it. Scheduled runs are best-effort (can be delayed 10+ min under
# GitHub load) and are auto-disabled after 60 days of repo inactivity, so the
# sweeper also has workflow_dispatch and writes a summary line every run so a
# dead sweeper is visible.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIGITAL_OCEAN_TOKEN: ${{ secrets.DIGITAL_OCEAN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Destroy stale shakedown droplets + reap keys
        run: |
          # The sweep logic lives in a script file (repo pattern, same as
          # vt-scan.py) so the workflow stays a thin caller and the Python is
          # testable in isolation. Token comes via env, never argv.
          python3 .github/scripts/shakedown-sweep.py --max-age-hours="${MAX_AGE_HOURS:-3}"

      - name: Summary
        run: |
          # A summary line every run makes a dead sweeper visible in the
          # Actions list even when there was nothing to sweep.
          echo "Shakedown sweeper ran at $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "No droplets should ever be older than ${MAX_AGE_HOURS:-3}h with this backstop." >> "$GITHUB_STEP_SUMMARY"
