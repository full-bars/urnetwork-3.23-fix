name: Sync Docs to Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'LOG_REFERENCE.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: main-repo
          persist-credentials: false

      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Sync markdown files to wiki
        run: |
          if [ -d "wiki-repo" ]; then
            echo "Copying documentation pages to wiki repository..."
            cp -v main-repo/docs/*.md wiki-repo/
            if [ -f "main-repo/docs/urnet-tools-go.md" ]; then
              cp -v main-repo/docs/urnet-tools-go.md wiki-repo/urnet-tools-Go.md
            fi
            # The log reference lives at the repo root so the README and the
            # docs can link to it; the wiki is flat, so publish it as
            # Log-Message-Reference and point every link at the wiki page names.
            cp -v main-repo/LOG_REFERENCE.md wiki-repo/Log-Message-Reference.md
            sed -E -i 's#\]\(docs/([A-Za-z0-9_-]+)\.md#](\1#g' wiki-repo/Log-Message-Reference.md
            sed -i 's#\.\./LOG_REFERENCE\.md#Log-Message-Reference#g' wiki-repo/*.md
            cd wiki-repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if [ -n "$(git status --porcelain)" ]; then
              git add .
              git commit -m "docs: automated sync from main docs/"
              git push origin master || git push origin main
            else
              echo "Wiki is already in sync."
            fi
          else
            echo "Wiki repo could not be checked out (check repository wiki settings)."
          fi
