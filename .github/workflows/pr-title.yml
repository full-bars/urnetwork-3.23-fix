name: Validate PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-title:
    name: Check Conventional Commit Format
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        with:
          requireScope: false
          subjectPattern: ^[A-Z].*[^.]$
          subjectPatternError: 'Subject "{subject}" must start with an uppercase letter and not end with a period'
