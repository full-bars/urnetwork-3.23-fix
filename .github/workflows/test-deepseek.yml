name: Test DeepSeek

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: List available models + test completion
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "=== 1. GET /models (valid model IDs) ==="
          MODELS=$(curl -s -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            "https://api.deepseek.com/models")
          echo "$MODELS" | jq -r '.data[].id' 2>/dev/null || echo "$MODELS"

          echo ""
          echo "=== 2. Test completion with deepseek-v4-flash ==="
          JSON_PAYLOAD=$(jq -n '{
            "model": "deepseek-v4-flash",
            "messages": [{"role": "user", "content": "Reply with exactly: deepseek-ok"}],
            "temperature": 0.2,
            "max_tokens": 50
          }')
          RESPONSE=$(curl -s -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -d "$JSON_PAYLOAD" \
            "https://api.deepseek.com/chat/completions")
          echo "RESPONSE: ${RESPONSE:0:600}"
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "FAIL: $ERROR"
            exit 1
          fi
          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          if [ -n "$CONTENT" ]; then
            echo "SUCCESS: $CONTENT"
          else
            echo "FAIL: no content in response"
            exit 1
          fi
