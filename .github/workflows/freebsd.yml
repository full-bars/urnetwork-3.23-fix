name: FreeBSD verification

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'releases/**'
  workflow_dispatch:

# Same reasoning as unix-lifecycle: every feature/* branch reaches CI through a
# pull request, so a branch-scoped push would only duplicate the pull_request
# run. cancel-in-progress supersedes rapid pushes to a PR rather than stacking
# them; main's runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freebsd-runtime:
    name: urnet-tools + provider on FreeBSD (real kernel)
    # The action boots a QEMU VM on the runner. runs-on stays ubuntu-latest
    # even for other arches — that is the action's documented requirement.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FreeBSD binaries on the runner (cross)
        env:
          GOPROXY: "https://proxy.golang.org|https://goproxy.io,direct"
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -o out/urnet-tools ./cmd/urnet-tools/ && \
               GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -o out/provider ./provider/; then
              echo "Build succeeded"; break
            fi
            if [ $attempt -lt 3 ]; then echo "Build failed, retrying in 10s..."; sleep 10
            else echo "Build failed after 3 attempts"; exit 1; fi
          done
          file out/urnet-tools out/provider

      - name: Run on a real FreeBSD kernel
        id: freebsd
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.5"
          mem: 4096
          cpu: 2
          sync: rsync
          prepare: |
            # procstat is base FreeBSD (procstat(1) is in the base system, not a
            # package). Do NOT pkg-install it: on a stock image there is no
            # matching package, the install fails, and a `|| true` here hides
            # that — which then breaks every procstat check downstream.
            command -v procstat >/dev/null 2>&1 || {
              echo "FATAL: procstat not present in the base image"
              exit 1
            }
          run: |
            echo "=== kernel ==="
            freebsd-version
            uname -a

            # The provider's docopt usage has NO version subcommand, so
            # `provider --version` prints usage and exits 1. Use `help`, which
            # is a real pattern and exits 0 — this proves the FreeBSD binary
            # actually LOADS AND RUNS, which is the claim being made.
            echo "=== binaries link and run natively ==="
            ./out/urnet-tools --version
            ./out/provider help > /dev/null
            echo "provider help exit=$?"

            # --- the reason this workflow exists -------------------------------
            # Each check below asserts a syscall/shell behavior that is
            # impossible to verify by cross-compiling on Linux: what procstat
            # actually prints, what LOCAL_PEERCRED returns, whether sysrc and
            # rc.d do what the Go code assumes.

            echo "=== procstat output shape (discovery parser contract) ==="
            procstat -b | head -5
            echo "--- credentials ---"
            procstat -s | head -5

            # --- live process discovery ---------------------------------------
            # `provide` is the only provider subcommand that stays running, so
            # it is the only way to get a real row in the process table for
            # the discovery parsers to read. `--version` and `help` both exit
            # immediately and would leave nothing to parse.
            echo "=== start a real provider process for discovery ==="
            mkdir -p "$HOME/.urnetwork"
            cp ./out/provider "$HOME/.urnetwork/urnetwork"
            echo "test-jwt-for-discovery" > "$HOME/.urnetwork/jwt"
            chmod 755 "$HOME/.urnetwork/urnetwork"
            ( HOME="$HOME" ./out/provider provide > /tmp/prov.out 2>&1 & echo $! > /tmp/bsd_pid )
            sleep 4
            bsd_pid="$(cat /tmp/bsd_pid 2>/dev/null || echo 0)"
            echo "provider pid=$bsd_pid"

            # Hard assertion, not a note: if procstat cannot show this process,
            # the discovery parser contract is broken and the feature is dead.
            echo "--- procstat -b for pid $bsd_pid ---"
            if ! procstat -b "$bsd_pid"; then
              echo "FATAL: procstat -b could not report pid $bsd_pid"
              cat /tmp/prov.out || true
              exit 1
            fi
            echo "--- procstat -s for pid $bsd_pid ---"
            if ! procstat -s "$bsd_pid"; then
              echo "FATAL: procstat -s could not report pid $bsd_pid"
              exit 1
            fi
            # EUID/RUID are columns 3 and 4 of the documented
            # "PID COMM EUID RUID ..." layout. If that layout ever changes the
            # discovery parsers silently attribute providers to the wrong user,
            # so assert the columns parse as numbers rather than printing them.
            euid="$(procstat -s "$bsd_pid" 2>/dev/null | awk 'NR==2 {print $3}')"
            if [ -z "$euid" ] || [ "$euid" -eq 0 ] 2>/dev/null; then
              echo "FATAL: could not parse EUID column (got '$euid'); procstat -s layout changed"
              procstat -s "$bsd_pid" || true
              exit 1
            fi
            echo "EUID parsed OK: $euid"

            echo "=== the tool discovers a live provider process ==="
            # This is the end-to-end assertion that the procstat parsers agree
            # with real output: a live process named like a provider must show
            # up in the inventory.
            if ./out/urnet-tools providers | tee /tmp/providers.out | grep -qi urnetwork; then
              echo "DISCOVERY OK: live provider found"
            else
              echo "FATAL: discovery did not find the live provider process"
              cat /tmp/providers.out || true
              echo "--- procstat -b (all) for comparison ---"
              procstat -b | head -20 || true
              exit 1
            fi
            kill "$bsd_pid" 2>/dev/null || true

            echo "=== FreeBSD tuning keys exist (optimize_bsd.go contract) ==="
            # Hard assertion: optimize_bsd.go writes exactly these names. If a
            # key does not exist, `optimize` applies nothing while reporting
            # success — the precise failure this workflow exists to catch.
            for k in net.inet.tcp.recvspace net.inet.tcp.sendspace \
                     kern.maxfiles kern.maxfilesperproc; do
              v="$(sysctl -n "$k" 2>/dev/null || true)"
              if [ -z "$v" ]; then
                echo "FATAL: tuning key $k does not exist on this kernel"
                exit 1
              fi
              printf '%-34s = %s\n' "$k" "$v"
            done
            # Host-memory keys the Go code reads.
            for k in hw.physmem vm.stats.vm.v_free_count vm.stats.vm.v_inactive_count; do
              v="$(sysctl -n "$k" 2>/dev/null || true)"
              if [ -z "$v" ]; then
                echo "FATAL: memory key $k does not exist; sysmem_freebsd.go would fall back"
                exit 1
              fi
              printf '%-34s = %s\n' "$k" "$v"
            done
            # The swap keys the pressure sensor reads. vm.swap_total is 0 when
            # no swap device is configured, which is a valid state (the sensor
            # then reports no pressure) — but the key must still EXIST.
            for k in vm.swap_total vm.swap_used; do
              if ! sysctl -n "$k" >/dev/null 2>&1; then
                echo "FATAL: swap key $k does not exist on this kernel"
                exit 1
              fi
              printf '%-34s = %s\n' "$k" "$(sysctl -n "$k")"
            done
            echo "--- linux-only keys must NOT resolve here ---"
            for k in net.core.rmem_max fs.file-max net.netfilter.nf_conntrack_max; do
              printf '%-34s = %s\n' "$k" "$(sysctl -n "$k" 2>/dev/null || echo 'absent (expected)')"
            done
            echo "--- sysrc present for persistence? ---"
            if ! command -v sysrc >/dev/null 2>&1; then
              echo "FATAL: sysrc missing; setAutoStart cannot write rc.conf"
              exit 1
            fi
            echo "sysrc OK"

            echo "=== rc.d + crontab present for lifecycle ==="
            for f in /etc/rc.subr; do
              if [ ! -f "$f" ]; then
                echo "FATAL: $f missing; the rc.d script cannot run"
                exit 1
              fi
              echo "$f OK"
            done
            for c in service crontab; do
              if ! command -v "$c" >/dev/null 2>&1; then
                echo "FATAL: $c missing; lifecycle commands cannot work"
                exit 1
              fi
              echo "$c OK"
            done

            echo "=== generated rc.d script is valid shell ==="
            # The Go renderer and the shell installer each carry a copy of
            # this template. Run the shell copy through the parser.
            sh -n ./scripts/Provider_Install_FreeBSD.sh && echo "installer SYNTAX OK"
            sh -n ./out/urnet-tools 2>/dev/null || true

            echo "=== LOCAL_PEERCRED availability (control socket check) ==="
            # peercred_freebsd.go compiles against unix.GetsockoptXucred; this
            # proves the option exists on this kernel rather than only in the
            # headers the binary was compiled against.
            # NOTE: no heredoc here on purpose — these run blocks execute with
            # sh in the VM, and a heredoc inside a YAML block scalar is a reliable
            # way to corrupt the script.
            printf '%s\n' \
              '#include <sys/types.h>' \
              '#include <sys/socket.h>' \
              '#include <sys/un.h>' \
              '#include <stdio.h>' \
              '#include <unistd.h>' \
              'int main(void) {' \
              '  int sv[2];' \
              '  if (socketpair(AF_LOCAL, SOCK_STREAM, 0, sv) != 0) { perror("socketpair"); return 1; }' \
              '  struct xucred xc; socklen_t len = sizeof(xc);' \
              '  if (getsockopt(sv[1], SOL_LOCAL, LOCAL_PEERCRED, &xc, &len) != 0) { perror("LOCAL_PEERCRED"); return 1; }' \
              '  printf("LOCAL_PEERCRED ok: cr_version=%u cr_uid=%u\\n", xc.cr_version, xc.cr_uid);' \
              '  return 0;' \
              '}' > /tmp/xucred_test.c
            if command -v cc >/dev/null 2>&1; then
              cc -o /tmp/xucred_test /tmp/xucred_test.c && /tmp/xucred_test || echo "NOTE: LOCAL_PEERCRED test failed"
            else
              echo "NOTE: no cc on the image; LOCAL_PEERCRED asserted by headers only"
            fi

            echo "=== provider actually starts under a real kernel ==="
            # The end-to-end claim: the binary runs, not just links.
            if [ -f "$HOME/.urnetwork/jwt" ]; then
              echo "state dir and jwt present"
              ls -la "$HOME/.urnetwork" || true
            fi

      - name: Go test suite on FreeBSD (native toolchain)
        id: gotest
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.5"
          mem: 6144
          cpu: 2
          sync: rsync
          prepare: |
            # pkg/go are needed to run the real test suite on the kernel. These
            # DO exist as packages; unlike procstat (base system) they must be
            # installed, and a failed install here must fail the job rather than
            # be swallowed by `|| true` — a missing compiler silently turns
            # this job into a no-op that always passes.
            pkg install -y go bash || {
              echo "FATAL: failed to install the Go toolchain on the VM"
              exit 1
            }
            command -v go >/dev/null 2>&1 || {
              echo "FATAL: go still not on PATH after pkg install"
              exit 1
            }
            go version
          run: |
            echo "=== go vet on FreeBSD ==="
            # go vet compiles every package for THIS GOOS, so it catches a
            # freebsd-tagged file that references a symbol that does not exist
            # on this kernel's build. This is the check that would have caught
            # the original 8 undefined symbols at PR time.
            go vet ./... 2>&1 | tail -40

            echo "=== go test: the FreeBSD-tagged tests ==="
            # These test files only compile and run on a FreeBSD kernel. On
            # Linux they are skipped or absent, so nothing else in CI executes
            # them — this is their only real coverage.
            go test -count=1 -v ./internal/urnettools/ \
              -run 'TestRenderBSD|TestBSDRcServiceName|TestParseProcstat|TestParseUIDField|TestBSDSysctl' 2>&1 | tail -40
            go test -count=1 -v ./provider/ \
              -run 'TestMemPressureSwapFrac|TestPeerAllowed' 2>&1 | tail -30
            go test -count=1 -v . -run 'TestHostMemoryReaders|TestEffectiveRAMLimit' 2>&1 | tail -20

            echo "=== the full suite (long) ==="
            # TMPDIR must be SHORT: Go nests the test name under TMPDIR and a
            # long path breaks AF_UNIX binds with EINVAL on any kernel.
            mkdir -p /tmp/gotest
            TMPDIR=/tmp/gotest go test -count=1 -timeout 900s ./internal/urnettools/ 2>&1 | tail -30

      - name: Summary
        if: always()
        run: |
          echo "FreeBSD runtime verification finished."
          echo "Review the step log above for the authoritative result:"
          echo "  - procstat output shape"
          echo "  - sysctl key presence for host memory and tuning"
          echo "  - rc.subr / service / crontab / sysrc availability"
          echo "  - LOCAL_PEERCRED availability"