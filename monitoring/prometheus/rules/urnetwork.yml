# Alert rules for URnetwork providers. Loaded by prometheus.yml (rule_files).
#
# Enabled rules: UrnetworkNodeDown, UrnetworkRestartLoop, the backend outage
# protection rules (UrnetworkBackendDegraded, UrnetworkFleetBackendDegraded,
# UrnetworkReconnectBudgetHeld, UrnetworkResendAmplification), and the stream
# and P2P rules (UrnetworkStreamTwoEndedHeld, UrnetworkStreamLongLived,
# UrnetworkP2PConnectFailuresSustained), and the dial backoff rule
# (UrnetworkDialLongBackoffGrowing).
# The rules under "Optional rules" further down are commented out. Read the
# note above each one, adjust the threshold to your fleet, then remove the
# leading "# " to enable it. See docs/Monitoring.md.
#
# These rules only make alerts visible in Prometheus (http://127.0.0.1:9090/alerts)
# and in the "ALERTS" series. Nothing is sent anywhere until you add an
# Alertmanager and point Prometheus at it.
#
# After editing, validate and test with:
#   promtool check rules prometheus/rules/urnetwork.yml
#   promtool test rules prometheus/rules/urnetwork.test.yml
# then reload with:  curl -X POST http://127.0.0.1:9090/-/reload

groups:
  - name: urnetwork
    rules:
      # A node whose /metrics endpoint has not answered for 5 minutes.
      - alert: UrnetworkNodeDown
        expr: up{job="urnetwork"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "URnetwork node {{ $labels.instance }} is down"
          description: >-
            Prometheus could not scrape {{ $labels.instance }} for 5 minutes.
            This does NOT tell a stopped provider apart from a provider with
            metrics switched off, a blocked port or a Tailscale outage, and it
            does not fire for a node that was removed from targets/providers.yml
            or never scraped. It says nothing about whether a reachable node is
            earning.

      # More than 3 restarts of one node within an hour.
      #
      # Why resets() on urnet_uptime_seconds and not urnet_startup_restarted:
      # urnet_uptime_seconds counts up from process start, so every restart
      # makes it drop, and resets() counts those drops. urnet_startup_restarted
      # is a gauge that holds one fixed value for the whole life of a process
      # (1 after an unclean shutdown, 0 otherwise). It never changes during a
      # run, so increase() over it does not count restarts, and a clean
      # restart or a systemd restart loop that exits cleanly reads 0 anyway.
      - alert: UrnetworkRestartLoop
        expr: resets(urnet_uptime_seconds{job="urnetwork"}[1h]) > 3
        labels:
          severity: warning
        annotations:
          summary: "URnetwork node {{ $labels.instance }} restarted more than 3 times in the last hour"
          description: >-
            The uptime of {{ $labels.instance }} dropped more than 3 times in an
            hour. This does NOT catch a restart that hides between two scrapes
            (the node stayed down longer than it had been up, so uptime is
            higher again on the next scrape), and it does not say why the
            node restarted. Look at urnet_restart_reason for the reason, and
            at the node's logs for the cause.

      # The provider's backend outage protection reads the platform as failing.
      #
      # urnet_govern_degraded is 1 while the last 60 seconds of platform connect
      # attempts on this host look like a failing backend (judged against what is
      # normal for this host, see docs/Configuration.md, "Backend outage
      # protection"). One host can read it wrongly if its own proxies are bad,
      # which is why UrnetworkFleetBackendDegraded asks for several.
      - alert: UrnetworkBackendDegraded
        expr: urnet_govern_degraded{job="urnetwork"} == 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "URnetwork node {{ $labels.instance }} reads the backend as degraded"
          description: >-
            {{ $labels.instance }} has judged the platform backend degraded for
            3 minutes. While it does, reconnects run under a shared attempt
            budget and automatic proxy evictions are held off. This does NOT
            prove the backend is down: a node with a poor proxy list can read it
            on its own. Check the [govern] lines in its log for the failure
            classes, and UrnetworkFleetBackendDegraded to see whether other nodes
            agree.

      # Several nodes agree that the backend is degraded.
      #
      # A fleet-wide signal is much stronger than one node's: independent
      # proxy lists rarely fail together. The threshold of 3 nodes is a
      # starting point, set it to a fraction of your fleet.
      - alert: UrnetworkFleetBackendDegraded
        expr: count(urnet_govern_degraded{job="urnetwork"} == 1) >= 3
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} URnetwork nodes read the backend as degraded"
          description: >-
            At least 3 nodes have judged the platform backend degraded for
            3 minutes. This is the signal of a backend episode like the one that
            made providers flood their pipes with reconnect traffic. It does NOT
            say what is wrong on the backend. Check whether urnet_govern_budget_rate
            has fallen on those nodes and what the [govern] lines report.

      # The attempt budget is holding reconnects back.
      #
      # 200 is open. Below it the budget is throttling platform connects, which
      # is the protection working. This one is about how LONG: a budget held for
      # half an hour means either a long outage or a node that is not opening back
      # up, and both need a person to look.
      - alert: UrnetworkReconnectBudgetHeld
        expr: urnet_govern_budget_rate{job="urnetwork"} < 200
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "URnetwork node {{ $labels.instance }} has held its reconnect budget below 200/s for 30 minutes"
          description: >-
            The connect attempt budget on {{ $labels.instance }} has been
            throttled for 30 minutes. This does NOT say whether the backend is
            still failing or the node simply has not reopened: compare with
            urnet_govern_degraded and look at the [govern] budget lines.

      # Resends are a large part of what a node sends.
      #
      # urnet_transfer_send_bytes_total splits what the transfer layer writes into
      # first sends and resends. A node whose far ends are slow resends the same
      # frames again and again: on one host 90% of everything transmitted was
      # resends while the billable payload stayed flat. The resend retry budget
      # bounds this; this rule shows when it is binding. The 100 KB/s floor keeps
      # an idle node, where a few frames are always resent, from firing.
      - alert: UrnetworkResendAmplification
        expr: >-
          rate(urnet_transfer_send_bytes_total{job="urnetwork",kind="resend"}[10m])
            > ignoring (kind) 2 * rate(urnet_transfer_send_bytes_total{job="urnetwork",kind="first"}[10m])
          and on (instance, job)
          rate(urnet_transfer_send_bytes_total{job="urnetwork",kind="resend"}[10m]) > 102400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "URnetwork node {{ $labels.instance }} sends more than twice as many resend bytes as first-send bytes"
          description: >-
            For 15 minutes more than 100 KB/s of what {{ $labels.instance }}
            transmits has been resends, and more than twice its first sends. This
            does NOT show which peer is not acknowledging, and a node with little
            traffic can briefly look amplified. See urnet_transfer_resend_deferred_total
            for what the retry budget is holding back.

      # Stream sequences outliving their transport show up here.
      #
      # A provider that does not relay carries no two-ended bookkeeping: the
      # kind exists for relay midpoints, so any steady two-ended count on such
      # a node is a parked sequence. A provider that DOES relay holds these
      # legitimately; scope this rule to the nodes that should not.
      - alert: UrnetworkStreamTwoEndedHeld
        expr: urnet_stream_sequences_by_kind{job="urnetwork", kind="two_ended"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "URnetwork node {{ $labels.instance }} has held two-ended stream sequences for 30 minutes"
          description: >-
            {{ $labels.instance }} has reported two-ended stream sequences for
            30 minutes. On a provider that does not relay this is the shape of
            sequences parked after their transport ended. Check
            urnet_stream_sequences_closed_total for the reason split, and
            urnet_p2p_transports_started_total against stopped_total.

      # Sequences living past an hour, at a sustained trickle.
      #
      # Healthy streams end with the connection that carried them, so the long
      # buckets should stay near empty. 0.01/s is about 36 ended sequences an
      # hour that lived over an hour; adjust to your fleet.
      - alert: UrnetworkStreamLongLived
        expr: (sum by (instance) (rate(urnet_stream_sequence_lifetime_seconds_bucket{job="urnetwork", le="+Inf"}[1h])) - sum by (instance) (rate(urnet_stream_sequence_lifetime_seconds_bucket{job="urnetwork", le="3600"}[1h]))) > 0.01
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "URnetwork node {{ $labels.instance }} is ending streams that lived over an hour"
          description: >-
            {{ $labels.instance }} keeps observing sequence lifetimes above one
            hour. This is the shape of a sequence that outlived its transport;
            compare the two_ended live count and the closed reason split.

      # P2P connection failures at a sustained rate.
      #
      # A slow trickle is peers going away, which is normal. 0.5/s sustained
      # means a peer is unreachable and transports are retrying; adjust to
      # your fleet.
      - alert: UrnetworkP2PConnectFailuresSustained
        expr: sum by (instance) (rate(urnet_p2p_connect_failures_total{job="urnetwork"}[10m])) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "URnetwork node {{ $labels.instance }} is failing P2P connects at a sustained rate"
          description: >-
            {{ $labels.instance }} has had P2P connection attempts return
            errors at more than 0.5 per second for 15 minutes (attempts that
            came up and then failed their readiness exchange are not counted). Check
            urnet_p2p_transports_started_total minus stopped_total for stuck
            transports, and the [p2p] log lines for the peer.

      # Identities parked in the long dial backoff tier, growing.
      #
      # active above zero is normal after trouble: an identity whose own path
      # keeps failing is backed off longer instead of burning the shared
      # attempt budget. What the rule watches is the ENTRANCE rate staying up
      # while identities are parked: 0.02/s is about 72 entries an hour;
      # adjust to your fleet.
      - alert: UrnetworkDialLongBackoffGrowing
        expr: sum by (instance) (rate(urnet_dial_backoff_long_tier_entered_total{job="urnetwork"}[1h])) > 0.02 and urnet_dial_backoff_long_tier_active{job="urnetwork"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "URnetwork node {{ $labels.instance }} keeps entering the long dial backoff tier"
          description: >-
            {{ $labels.instance }} is entering the long dial backoff tier at a
            sustained rate while identities are parked in it, which is a node
            whose own paths keep failing. Check the transport counters and the
            [govern] lines for what its identities cannot reach.

      # ---------------------------------------------------------------------
      # Optional rules. Commented out on purpose: they need thresholds that fit
      # your fleet, and a few use metrics only new providers export
      # (urnet_mem_limit_bytes, urnet_open_fds, urnet_fd_limit). Providers
      # that do not export a metric never match its rule, so a mixed fleet
      # is safe. Remove the leading "# " of a block to enable it.
      # ---------------------------------------------------------------------

      # Optional: platform speed tests are costing a lot of bandwidth.
      #
      # Every connect is speed-tested by the platform (about 2 MiB each way on the
      # proxy, none of it billable), so a mass reconnect is a bandwidth event.
      # This fires when a node echoes more than 20 GB in 15 minutes, far above a
      # restart of a large fleet. Raise it for a bigger fleet.
      #
      # - alert: UrnetworkSpeedTestStorm
      #   expr: increase(urnet_speedtest_echo_bytes_total{job="urnetwork"}[15m]) > 20e9
      #   labels:
      #     severity: warning
      #   annotations:
      #     summary: "URnetwork node {{ $labels.instance }} echoed more than 20 GB of speed tests in 15 minutes"
      #     description: >-
      #       The platform speed-tested {{ $labels.instance }} heavily. This
      #       does NOT mean anything is leaking on the node: speed tests are the
      #       platform's, and the cost scales with connects.

      # Optional: a node running a different version from most of the fleet
      # for more than 7 days.
      #
      # Versions are text, so PromQL cannot order them or tell which is newer.
      # This rule compares each node with the version most nodes run right
      # now (topk(1, count by (version))) and flags the others. It works while
      # the majority is on the new version. During a slow rollout, when most
      # nodes still run the old one, it flags the early upgraders instead. To
      # pin a version by hand, replace the right-hand side with a literal:
      #   urnet_info{job="urnetwork", version!="<the version you want>"}
      # With a tie in the count, topk picks one of the tied versions.
      # The pending timer is kept in Prometheus memory and restored after a
      # restart from stored history, so a long outage of Prometheus itself
      # can restart the 7 days.
      #
      # - alert: UrnetworkOldVersion
      #   expr: >-
      #     urnet_info{job="urnetwork"}
      #     unless on (version)
      #     topk(1, count by (version) (urnet_info{job="urnetwork"}))
      #   for: 7d
      #   labels:
      #     severity: info
      #   annotations:
      #     summary: "URnetwork node {{ $labels.instance }} runs {{ $labels.version }}, not the fleet's most common version"
      #     description: >-
      #       {{ $labels.instance }} has run a different version from most of
      #       the fleet for 7 days. This does NOT know which version is newer,
      #       so it can flag the newest node during a rollout, and it does not
      #       fire on a fleet that is uniformly out of date.

      # Optional: Go runtime memory close to the memory limit.
      #
      # urnet_mem_sys_bytes is what the Go runtime holds from the OS, the
      # number the Go memory limit is enforced against. The guards skip
      # nodes with no limit (a limit of 0, or the very large value the Go
      # runtime reports when none is set).
      #
      # - alert: UrnetworkMemoryNearLimit
      #   expr: >-
      #     urnet_mem_sys_bytes{job="urnetwork"} / urnet_mem_limit_bytes{job="urnetwork"} > 0.9
      #     and urnet_mem_limit_bytes{job="urnetwork"} > 0
      #     and urnet_mem_limit_bytes{job="urnetwork"} < 1e15
      #   for: 15m
      #   labels:
      #     severity: warning
      #   annotations:
      #     summary: "URnetwork node {{ $labels.instance }} memory is above 90% of its limit"
      #     description: >-
      #       Memory obtained from the OS by {{ $labels.instance }} has been
      #       above 90% of urnet_mem_limit_bytes for 15 minutes. This does NOT
      #       measure resident memory (see urnet_rss_bytes), memory used by
      #       other processes on the machine, or a container limit that is
      #       lower than the Go limit.

      # Optional: open file descriptors close to the limit.
      #
      # Linux only. Nodes on other systems do not export these metrics and
      # never match.
      #
      # - alert: UrnetworkFileDescriptorsNearLimit
      #   expr: >-
      #     urnet_open_fds{job="urnetwork"} / urnet_fd_limit{job="urnetwork"} > 0.85
      #     and urnet_fd_limit{job="urnetwork"} > 0
      #   for: 10m
      #   labels:
      #     severity: warning
      #   annotations:
      #     summary: "URnetwork node {{ $labels.instance }} uses more than 85% of its file descriptors"
      #     description: >-
      #       {{ $labels.instance }} has had more than 85% of its descriptor
      #       limit open for 10 minutes. This does NOT show which kind of
      #       descriptor is leaking, and it cannot warn about a spike that
      #       fills the limit between two scrapes.

      # Optional: a node that is up but has billed no traffic for 30 minutes.
      #
      # An idle node with no clients is normal, so this can be noisy. Enable
      # it if your nodes usually have steady demand. The uptime guard keeps
      # a node that just restarted from firing before it had time to bill.
      #
      # - alert: UrnetworkNoBillableTraffic
      #   expr: >-
      #     sum by (job, instance) (rate(urnet_billable_bytes_total{job="urnetwork"}[30m])) == 0
      #     and on (instance) up{job="urnetwork"} == 1
      #     and on (instance) urnet_uptime_seconds{job="urnetwork"} > 1800
      #   for: 10m
      #   labels:
      #     severity: warning
      #   annotations:
      #     summary: "URnetwork node {{ $labels.instance }} is up but billed no traffic for 30 minutes"
      #     description: >-
      #       {{ $labels.instance }} answered scrapes but billable bytes did not
      #       grow for 30 minutes. This does NOT distinguish a broken node
      #       from a quiet one with no demand, and it does not fire if the
      #       billable counter is missing altogether.
